name: Обновление каталога em-c.kz

on:
  schedule:
    # каждый день в 03:00 UTC (~08:00/09:00 по Казахстану)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 Pillow

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated catalog
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/materials.json data/images
          git diff --cached --quiet && echo "Изменений нет" || git commit -m "Автообновление каталога"
          git fetch origin main
          git rebase origin/main
          git push
