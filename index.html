<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Каталог материалов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Фиксированная фирменная палитра (та же, что на стартовом экране) — по
     согласованию каталог больше не подстраивается под тему Telegram
     (--tg-theme-*), чтобы не было разрыва между тёмным сплэшем и светлым
     каталогом. */
  :root{
    --bg: #14120f;
    --text: #ece6d8;
    --hint: #9c9583;
    --link: #c9a15a;
    --button: #c9a15a;
    --button-text: #1a1408;
    --secbg: #1d1a16;
    --line: #34301f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{padding:8px 10px 24px;}

  .topbar{position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:5;border-bottom:1px solid var(--line);}
  .search{
    width:100%;padding:10px 12px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:15px;outline:none;
  }
  .search::placeholder{color:var(--hint);}

  .topbar-row{display:flex;gap:8px;align-items:center;}
  .search{flex:1;}
  .fav-btn{
    flex:0 0 auto;height:40px;padding:0 14px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background-color .15s ease,color .15s ease;
  }
  .fav-btn.active{background:#e0245e;color:#fff;}

  /* Категории и подкатегории — всегда на виду, двумя рядами под поиском.
     Обе строки — часть sticky-топбара (тот же .topbar с position:sticky),
     поэтому едут вместе при скролле, ничего не нужно открывать отдельно. */
  .cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none;}
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex:0 0 auto;padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600;
    background:var(--secbg);color:var(--text);cursor:pointer;white-space:nowrap;
    border:1px solid var(--line);transition:background-color .15s ease,color .15s ease;
  }
  .cat-tab.active{background:var(--button);color:var(--button-text);border-color:transparent;}

  /* Подкатегории — аккордеон-панель вертикальным списком вместо горизонтальной
     ленты чипов: масштабируется на 10-20+ пунктов без "скролла вбок",
     сворачивается обратно после выбора, чтобы не занимать место постоянно. */
  .cat-subpanel{margin-top:8px;border-radius:12px;background:var(--secbg);overflow:hidden;}
  .cat-subpanel-header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 14px;cursor:pointer;font-size:13.5px;font-weight:600;
  }
  .cat-subpanel-header .arrow{color:var(--hint);font-size:11px;transition:transform .2s ease;}
  .cat-subpanel.expanded .cat-subpanel-header .arrow{transform:rotate(180deg);}
  .cat-subpanel-list{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .cat-subpanel.expanded .cat-subpanel-list{max-height:600px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .cat-subitem{
    display:flex;justify-content:space-between;gap:8px;padding:10px 14px;
    font-size:13px;color:var(--text);cursor:pointer;border-top:1px solid var(--line);
  }
  .cat-subitem:active{background:rgba(255,255,255,0.05);}
  .cat-subitem.active{color:var(--button);font-weight:700;}
  .cat-subitem .n{color:var(--hint);font-size:11.5px;flex:0 0 auto;}

  .breadcrumb{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hint);
    padding:8px 2px 0;
  }
  .breadcrumb b{color:var(--text);font-weight:600;}
  .breadcrumb .bc-reset{margin-left:auto;color:var(--button);font-weight:600;cursor:pointer;}

  .search-suggest{display:flex;gap:6px;overflow-x:auto;padding:0;scrollbar-width:none;}
  .search-suggest::-webkit-scrollbar{display:none;}
  .search-suggest.show{padding:8px 0 0;}
  .suggest-chip{
    flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12px;
    background:var(--secbg);color:var(--text);border:1px solid var(--line);cursor:pointer;
    white-space:nowrap;
  }
  .suggest-chip .n{color:var(--hint);margin-left:5px;font-size:10.5px;}

  .count{color:var(--hint);font-size:12px;margin:8px 2px 4px;}
  .count-row{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 4px;}
  .count-row .count{margin:0;}
  .sort-select{
    background:var(--secbg);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:5px 8px;font-size:11.5px;font-family:inherit;
  }
  .load-more{
    grid-column:1/-1;text-align:center;padding:13px;margin-top:6px;border-radius:12px;
    background:var(--secbg);color:var(--button);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .load-more:active{opacity:.8;}

  /* align-items:start — карточки НЕ растягиваются под высоту самой высокой
     соседки в ряду, а сохраняют собственную натуральную высоту (см. .card
     img ниже, без фикс. aspect-ratio) — почти-masonry-эффект без ухода от
     CSS Grid (colum-based masonry ломает sticky-заголовки категорий). */
  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;
    align-items:start;
  }
  @media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr);}}

  /* Ориентир в общем списке из 500+ позиций: заголовок категории "прилипает"
     под топбаром при прокрутке, пока в поле зрения карточки этой категории.
     top задаётся в JS (высота топбара) — она немного плавает от контента. */
  .section-header{
    grid-column:1/-1;position:sticky;top:var(--topbar-h, 0px);z-index:3;background:var(--bg);
    padding:12px 2px 7px;font-size:13px;font-weight:700;color:var(--text);
    border-bottom:1px solid var(--line);
  }
  .section-header:first-of-type{padding-top:2px;}

  .card{
    background:var(--secbg);border-radius:14px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;
    transition:transform .12s ease;
    scroll-margin-top:var(--topbar-h, 0px);
  }
  .card:active{transform:scale(0.97);}
  .card.appear{animation:cardIn .3s ease both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* Источник обозначен ОДНИМ сигналом — точкой у категории (см. .source-dot
     ниже). Раньше это дублировалось ещё и цветной полоской сверху карточки —
     убрали, чтобы не тратить внимание на повтор одной и той же информации. */
  .source-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* Фиксированное соотношение сторон 4:3 с object-fit:cover — иначе широкие
     исходные фото (например ПВХ плёнка) давали визуально "маленькие",
     приплюснутые по высоте карточки при натуральных пропорциях. */
  .card .thumb-wrap{position:relative;width:100%;aspect-ratio:3/4;background:var(--secbg);cursor:pointer;overflow:hidden;}
  .card .thumb-wrap.skeleton{min-height:110px;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s ease;}
  .card img.loaded{opacity:1;}
  .card .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--hint);font-size:12px;text-align:center;padding:10px;}

  /* skeleton-плейсхолдеры на время загрузки */
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  .skeleton{
    background-image:linear-gradient(90deg, var(--secbg) 25%, rgba(120,120,130,0.14) 37%, var(--secbg) 63%);
    background-size:400px 100%;animation:shimmer 1.4s ease infinite;
  }
  .skeleton-card{border-radius:14px;aspect-ratio:1;}

  /* Два маленьких действия поверх фото (сердечко + копировать) вместо
     сердечка на фото И ещё полноширинной кнопки "Копировать" под каждой из
     574 карточек — так текстуре снизу достаётся весь блок вместо повторной
     UI-обвязки на каждой карточке. */
  .heart, .copy-icon-btn{
    position:absolute;right:6px;width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;transition:background-color .15s ease,transform .1s ease;
  }
  .heart{top:6px;font-size:15px;}
  .heart.active{background:#e0245e;animation:heartPop .25s ease;}
  @keyframes heartPop{0%{transform:scale(1);}45%{transform:scale(1.25);}100%{transform:scale(1);}}
  .copy-icon-btn{top:40px;}
  .copy-icon-btn:active{background:rgba(0,0,0,0.6);transform:scale(0.92);}
  .copy-icon-btn svg{width:14px;height:14px;}

  /* Подпись (название + категория) лежит поверх нижней части фото, а не в
     отдельном блоке под ним — фото занимает всю карточку целиком. */
  .card-caption{
    position:absolute;left:0;right:0;bottom:0;padding:22px 9px 9px;
    background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.5) 55%, transparent 100%);
    pointer-events:none;
  }
  .card-caption-name{
    font-size:12.5px;line-height:1.3;font-weight:600;color:#fff;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-caption-cat{
    font-size:10.5px;color:rgba(255,255,255,.75);display:flex;align-items:center;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .empty{text-align:center;color:var(--hint);padding:40px 10px;font-size:14px;}

  /* fullscreen viewer — фото во весь экран, без полей. Название/категория
     и точки-пагинация лежат ПОВЕРХ фото (градиент снизу для читаемости),
     а не отдельным блоком под ним — экран отдан целиком материалу. */
  .viewer{
    position:fixed;inset:0;background:#000;z-index:50;overflow:hidden;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .viewer.open{opacity:1;pointer-events:auto;}
  /* .vitem — двигается ВЕРТИКАЛЬНО между материалами (свайп вверх/вниз).
     .vswipe/.vtrack внутри него двигаются ГОРИЗОНТАЛЬНО между фото ОДНОГО
     материала (свайп влево/вправо) — два независимых жеста на разных осях,
     см. initViewerGestures в скрипте. */
  .vitem{position:absolute;inset:0;}
  .vswipe{position:absolute;inset:0;overflow:hidden;touch-action:none;}
  .vtrack{display:flex;width:100%;height:100%;will-change:transform;}
  .vslide{flex:0 0 100%;width:100%;height:100%;position:relative;overflow:hidden;background:#000;}
  .vslide img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  /* blur-up: пока грузится полноразмерное фото, сразу показываем уже
     закэшированное маленькое превью растянутым и размытым — воспринимается
     как мгновенное открытие, даже если полный размер ещё в пути */
  .vslide .vthumb{filter:blur(16px);transform:scale(1.08);transition:opacity .3s ease;}
  .vslide .vfull{opacity:0;transition:opacity .3s ease;}
  .vslide .vfull.loaded{opacity:1;}
  .vgradient{
    position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.8) 100%);
  }
  .vcaption{position:absolute;left:0;right:0;bottom:0;padding:0 20px 24px;}
  .vdots{display:flex;gap:6px;margin-bottom:12px;}
  .vdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);transition:background .2s,transform .2s;}
  .vdot.active{background:#fff;transform:scale(1.2);}
  .vcat{color:#c9a15a;font-size:12px;font-weight:500;margin-bottom:4px;}
  .vname{color:#fff;font-size:17px;font-weight:500;}
  .vnav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;pointer-events:none;}
  .vnavbtn{
    background:rgba(0,0,0,0.45);border:none;color:#fff;font-size:28px;
    width:40px;height:40px;border-radius:50%;cursor:pointer;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:background .15s,opacity .2s;flex:0 0 auto;
  }
  .vnavbtn:active{background:rgba(0,0,0,0.75);}
  .vnavbtn.hidden{opacity:0;pointer-events:none;}
  .vactions{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:2;}
  .vclose, .vcopy, .vheart{
    width:36px;height:36px;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.15);cursor:pointer;font-size:18px;
    transition:background-color .15s ease,transform .1s ease;
  }
  .vcopy svg{width:15px;height:15px;}
  .vheart.active{background:#e0245e;animation:heartPop .25s ease;}

  /* ---- стартовый экран (splash) ----
     Показывается только при первом запуске. Палитра намеренно фиксированная
     (не привязана к теме Telegram --tg-theme-*), как согласованный фирменный
     стиль стартового экрана — цвета совпадают с утверждённым макетом. */
  .splash{
    position:fixed;inset:0;z-index:100;background:#14120f;
    transition:opacity .35s ease;
  }
  .splash.fade-out{opacity:0;pointer-events:none;}
  .splash-hero{
    position:absolute;inset:0;
    background-image:
      linear-gradient(to bottom, rgba(10,9,8,.15) 0%, rgba(10,9,8,.45) 55%, rgba(10,9,8,.97) 92%),
      url('0000001.webp');
    background-size:cover;background-position:center;
  }
  .splash-top-label{
    position:absolute;top:22px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:2px;color:rgba(236,230,216,.6);text-transform:uppercase;
  }
  .splash-content{position:absolute;left:0;right:0;bottom:0;padding:0 24px 34px;}
  .splash-eyebrow{font-size:12px;color:#c9a15a;font-weight:700;letter-spacing:.5px;margin-bottom:8px;}
  .splash-title{font-size:26px;font-weight:800;line-height:1.15;color:#ece6d8;margin-bottom:8px;}
  .splash-sub{font-size:13.5px;color:#9c9583;line-height:1.5;margin-bottom:22px;max-width:300px;}
  .splash-cta{
    width:100%;background:#c9a15a;color:#1a1408;font-weight:700;font-size:15px;
    padding:15px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;
  }
  .splash-cta:active{transform:scale(0.98);}
</style>
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-hero"></div>
  <div class="splash-top-label">NeoModernKz</div>
  <div class="splash-content">
    <div class="splash-eyebrow" id="splashEyebrow">Материалы для мебели</div>
    <div class="splash-title">Материалы для мебели<br>в одном каталоге</div>
    <div class="splash-sub">Акриловый камень, плёнка ПВХ, листовые материалы — фото, коды, названия под рукой на объекте.</div>
    <button class="splash-cta" id="splashCta">Каталог</button>
  </div>
</div>
<script>
  // Синхронная быстрая проверка ДО отрисовки остального — чтобы у тех, кто
  // уже видел сплэш раньше, не было даже короткой "вспышки" тёмного экрана
  // поверх каталога. localStorage тут просто быстрый локальный кэш флага;
  // источник истины (CloudStorage, синхронизируется между устройствами)
  // проверяется отдельно ниже, в основном скрипте приложения.
  (function(){
    try {
      if (localStorage.getItem('splash_seen') === '1') {
        var s = document.getElementById('splash');
        if (s) s.style.display = 'none';
      }
    } catch (e) {}
  })();
</script>
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <button class="fav-btn" id="favBtn">★ Избранное</button>
      <input class="search" id="search" type="text" placeholder="Поиск по названию или коду...">
    </div>
    <div class="search-suggest" id="searchSuggest"></div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="cat-subpanel" id="catSubpanel" style="display:none;">
      <div class="cat-subpanel-header" id="catSubpanelHeader">
        <span id="catSubpanelLabel"></span>
        <span class="arrow">▾</span>
      </div>
      <div class="cat-subpanel-list" id="catSubpanelList"></div>
    </div>
    <div class="breadcrumb" id="breadcrumb" style="display:none;"></div>
  </div>
  <div class="count-row">
    <div class="count" id="count"></div>
    <select class="sort-select" id="sortSelect">
      <option value="default">По умолчанию</option>
      <option value="name-asc">Название А→Я</option>
      <option value="name-desc">Название Я→А</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Ничего не найдено</div>
</div>

<div class="viewer" id="viewer">
  <div class="vitem" id="vitem">
    <div class="vswipe" id="vswipe">
      <div class="vtrack" id="vtrack"></div>
      <div class="vnav">
        <button class="vnavbtn hidden" id="vprev">‹</button>
        <button class="vnavbtn hidden" id="vnext">›</button>
      </div>
    </div>
    <div class="vgradient"></div>
    <div class="vcaption">
      <div class="vdots" id="vdots"></div>
      <div class="vcat" id="vcat"></div>
      <div class="vname" id="vname"></div>
    </div>
  </div>
  <div class="vactions">
    <div class="vclose" id="vclose">✕</div>
    <div class="vheart" id="vheart" title="В избранное">♡</div>
    <div class="vcopy" id="vcopy" title="Скопировать название">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    </div>
  </div>
</div>

<script>
(function(){
  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  var state = {
    items: [],
    category: 'Все',
    activeSite: null,      // ключ источника (emc/adilet/interstone), если выбрана вкладка источника
    filterMode: 'all',     // 'all' | 'site' | 'category'
    favOnly: false,
    query: '',
    favorites: [],
    sort: 'default',       // 'default' | 'name-asc' | 'name-desc'
    visibleCount: 40        // сколько карточек отрисовано (постраничная подгрузка)
  };

  var els = {
    topbar: document.querySelector('.topbar'),
    grid: document.getElementById('grid'),
    favBtn: document.getElementById('favBtn'),
    search: document.getElementById('search'),
    count: document.getElementById('count'),
    sortSelect: document.getElementById('sortSelect'),
    empty: document.getElementById('empty'),
    viewer: document.getElementById('viewer'),
    vitem: document.getElementById('vitem'),
    vswipe: document.getElementById('vswipe'),
    vtrack: document.getElementById('vtrack'),
    vdots: document.getElementById('vdots'),
    vprev: document.getElementById('vprev'),
    vnext: document.getElementById('vnext'),
    vname: document.getElementById('vname'),
    vcat: document.getElementById('vcat'),
    vcopy: document.getElementById('vcopy'),
    vheart: document.getElementById('vheart'),
    vclose: document.getElementById('vclose'),
    catTabs: document.getElementById('catTabs'),
    catSubpanel: document.getElementById('catSubpanel'),
    catSubpanelHeader: document.getElementById('catSubpanelHeader'),
    catSubpanelLabel: document.getElementById('catSubpanelLabel'),
    catSubpanelList: document.getElementById('catSubpanelList'),
    breadcrumb: document.getElementById('breadcrumb'),
    searchSuggest: document.getElementById('searchSuggest')
  };

  // ---- группировка категорий по сайтам-источникам (для рядов вкладок) ----
  // Категории неймспейсятся по префиксу названия — это позволяет добавлять
  // новые сайты/категории в скрапере без правок фронтенда: всё, что не
  // "ПВХ плёнка: ..." и не "Акриловый камень ...", считается материалами em-c.kz.
  function siteGroupOf(cat){
    if (cat.indexOf('ПВХ плёнка') === 0) return 'adilet';
    if (cat.indexOf('Акриловый камень') === 0) return 'interstone';
    return 'emc';
  }
  // Цвета точек-источников чуть скорректированы под тёплую тёмную палитру
  // (чтобы не сливались с золотым акцентом --button и читались на #14120f).
  var SITE_META = {
    emc: { title: 'Листовые материалы', subtitle: 'EM-C.KZ', color: '#6fa3d8' },
    adilet: { title: 'Плёнка ПВХ', subtitle: 'ADILET.NET', color: '#d98f4e' },
    interstone: { title: 'Акриловый камень', subtitle: 'INTERSTONE.KZ', color: '#93a0ac' }
  };
  var SITE_ORDER = ['emc', 'adilet', 'interstone'];

  // ---- избранное: Telegram CloudStorage с фоллбеком на localStorage ----
  // CloudStorage доступен не во всех версиях клиента Telegram (и отсутствует
  // вовсе при открытии страницы вне Telegram) — вызов может синхронно кинуть
  // исключение ("WebAppMethodUnsupported"), поэтому всё оборачиваем в try/catch.
  function cloudStorageAvailable(){
    return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  }

  function loadFavorites(cb){
    if (cloudStorageAvailable()) {
      try {
        tg.CloudStorage.getItem('favorites', function(err, value){
          if (!err && value) {
            try { state.favorites = JSON.parse(value); } catch(e){ state.favorites = []; }
          }
          cb();
        });
      } catch (e) {
        loadFavoritesLocal();
        cb();
      }
    } else {
      loadFavoritesLocal();
      cb();
    }
  }

  function loadFavoritesLocal(){
    try { state.favorites = JSON.parse(localStorage.getItem('favorites') || '[]'); } catch(e){ state.favorites = []; }
  }

  function saveFavorites(){
    var json = JSON.stringify(state.favorites);
    if (cloudStorageAvailable()) {
      try { tg.CloudStorage.setItem('favorites', json, function(){}); }
      catch (e) { localStorage.setItem('favorites', json); }
    } else {
      localStorage.setItem('favorites', json);
    }
  }

  function toggleFavorite(id){
    var idx = state.favorites.indexOf(id);
    if (idx >= 0) state.favorites.splice(idx, 1);
    else state.favorites.push(id);
    saveFavorites();
    render();
    // Вьювер — отдельный оверлей поверх сетки, render() его не трогает,
    // поэтому сердечко в нём синхронизируем отдельно (если вьювер открыт).
    updateViewerHeart();
  }

  // ---- загрузка каталога ----
  function loadCatalog(){
    fetch('data/materials.json', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        console.log('[catalog] каталог загружен:', data.length, 'позиций');
        state.items = data;
        updateFavBtn();
        buildCatTabs();
        buildCatSubpanel();
        buildBreadcrumb();
        render();
        // Реальное число материалов вместо статичной цифры на сплэше —
        // актуально всегда, даже когда каталог пополняется скрапером.
        var splashEyebrow = document.getElementById('splashEyebrow');
        if (splashEyebrow) {
          splashEyebrow.textContent = data.length + ' материалов · ' + SITE_ORDER.length + ' источника';
        }
      })
      .catch(function(err){
        console.error('[catalog] ошибка загрузки materials.json:', err);
        els.empty.style.display = 'block';
        els.empty.textContent = 'Не удалось загрузить каталог';
      });
  }

  // ---- кнопка "Избранное" в топбаре — просто вкл/выкл фильтр по избранному ----
  function updateFavBtn(){
    els.favBtn.className = 'fav-btn' + (state.favOnly ? ' active' : '');
    els.favBtn.textContent = state.favOnly ? '★ Избранное' : '☆ Избранное';
  }
  els.favBtn.onclick = function(){
    state.favOnly = !state.favOnly;
    render();
    updateFavBtn();
  };

  // ---- сортировка ----
  els.sortSelect.onchange = function(){
    state.sort = els.sortSelect.value;
    render();
  };

  // ---- категории и подкатегории всегда на виду, двумя рядами под поиском ----
  // Ряд 1 (cat-tabs): "Все" + вкладка на каждый сайт-источник — тап сразу
  // применяет фильтр (никакого черновика/кнопки "показать", в отличие от
  // прежней модалки, — выбор применяется мгновенно, как обычные табы).
  // Подкатегории внутри выбранного источника — аккордеон-панель вертикальным
  // списком (buildCatSubpanel), не отдельная лента чипов — показывается только если у источника больше одной категории (иначе
  // сам факт выбора вкладки уже говорит "показать всё из этого источника").
  function buildCatTabs(){
    var groups = {};
    state.items.forEach(function(it){
      var g = siteGroupOf(it.category);
      if (!groups[g]) groups[g] = { cats: {}, total: 0 };
      groups[g].total++;
      groups[g].cats[it.category] = (groups[g].cats[it.category] || 0) + 1;
    });
    state._siteGroups = groups; // переиспользуется в buildCatSubpanel

    els.catTabs.innerHTML = '';

    var allTab = document.createElement('div');
    allTab.className = 'cat-tab' + (state.filterMode === 'all' ? ' active' : '');
    allTab.textContent = 'Все';
    allTab.onclick = function(){
      state.filterMode = 'all';
      state.activeSite = null;
      state.category = 'Все';
      state.favOnly = false;
      applyFilterChange();
    };
    els.catTabs.appendChild(allTab);

    SITE_ORDER.forEach(function(key){
      var g = groups[key];
      if (!g) return;
      var meta = SITE_META[key] || { title: key, subtitle: '', color: '#888' };
      var tab = document.createElement('div');
      tab.className = 'cat-tab' + (state.filterMode !== 'all' && state.activeSite === key ? ' active' : '');
      tab.textContent = meta.title;
      tab.onclick = function(){
        state.filterMode = 'site';
        state.activeSite = key;
        state.category = 'Все'; // фильтруем по всему источнику, пока не выбрана конкретная подкатегория
        state.favOnly = false;
        state._subpanelExpanded = true; // сразу видно список подкатегорий после выбора вкладки
        applyFilterChange();
      };
      els.catTabs.appendChild(tab);
    });
  }

  // ---- подкатегории: аккордеон-панель вертикальным списком ----
  // Свёрнутый заголовок показывает текущий выбор ("Все" или конкретную
  // категорию) + стрелку; тап по заголовку раскрывает/сворачивает список.
  // После выбора пункта список автоматически сворачивается обратно.
  function buildCatSubpanel(){
    if (state.filterMode === 'all' || !state.activeSite) {
      els.catSubpanel.style.display = 'none';
      return;
    }
    var g = (state._siteGroups || {})[state.activeSite];
    var catNames = g ? Object.keys(g.cats).sort(function(a, b){ return g.cats[b] - g.cats[a]; }) : [];
    // Если у источника всего одна категория — отдельная панель избыточна,
    // сама вкладка источника уже полностью его описывает.
    if (catNames.length <= 1) {
      els.catSubpanel.style.display = 'none';
      return;
    }
    els.catSubpanel.style.display = 'block';

    var isExpanded = !!state._subpanelExpanded;
    els.catSubpanel.className = 'cat-subpanel' + (isExpanded ? ' expanded' : '');
    els.catSubpanelLabel.textContent = state.filterMode === 'category' ? state.category : 'Все категории';

    els.catSubpanelList.innerHTML = '';

    var allItem = document.createElement('div');
    allItem.className = 'cat-subitem' + (state.filterMode === 'site' ? ' active' : '');
    allItem.innerHTML = '<span>Все категории</span><span class="n">' + g.total + '</span>';
    allItem.onclick = function(){
      state.filterMode = 'site';
      state.category = 'Все';
      state._subpanelExpanded = false;
      applyFilterChange();
    };
    els.catSubpanelList.appendChild(allItem);

    catNames.forEach(function(catName){
      var item = document.createElement('div');
      item.className = 'cat-subitem' + (state.filterMode === 'category' && state.category === catName ? ' active' : '');
      item.innerHTML = '<span>' + catName + '</span><span class="n">' + g.cats[catName] + '</span>';
      item.onclick = function(){
        state.filterMode = 'category';
        state.category = catName;
        state._subpanelExpanded = false;
        applyFilterChange();
      };
      els.catSubpanelList.appendChild(item);
    });
  }

  els.catSubpanelHeader.onclick = function(){
    state._subpanelExpanded = !state._subpanelExpanded;
    buildCatSubpanel();
  };

  // ---- хлебная крошка: видно точный путь, не нужно смотреть на вкладки,
  // чтобы понять, где находишься (важно при большом числе категорий) ----
  function buildBreadcrumb(){
    if (state.favOnly || state.filterMode === 'all') {
      els.breadcrumb.style.display = 'none';
      return;
    }
    var meta = SITE_META[state.activeSite] || { title: state.activeSite };
    var html = '<b>' + meta.title + '</b>';
    if (state.filterMode === 'category') {
      html += ' › <b>' + state.category + '</b>';
    }
    html += '<span class="bc-reset" id="bcReset">Сбросить ✕</span>';
    els.breadcrumb.innerHTML = html;
    els.breadcrumb.style.display = 'flex';
    document.getElementById('bcReset').onclick = function(){
      state.filterMode = 'all';
      state.activeSite = null;
      state.category = 'Все';
      applyFilterChange();
    };
  }

  // Общая точка после любого изменения фильтра — вкладки/чипы тоже
  // перерисовываются, чтобы подсветка активного пункта была всегда верной.
  function applyFilterChange(){
    render();
    updateFavBtn();
    buildCatTabs();
    buildCatSubpanel();
    buildBreadcrumb();
  }

  function matches(item){
    if (state.favOnly && state.favorites.indexOf(item.id) === -1) return false;
    if (!state.favOnly) {
      if (state.filterMode === 'site' && siteGroupOf(item.category) !== state.activeSite) return false;
      if (state.filterMode === 'category' && item.category !== state.category) return false;
    }
    if (state.query) {
      var q = state.query.toLowerCase();
      if (item.name.toLowerCase().indexOf(q) === -1 && item.id.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  // ---- фоновая предзагрузка полноразмерных фото ----
  // Пока пользователь листает сетку карточек (там грузятся только лёгкие
  // превью), в фоне тихо подгружаем полноразмерные фото карточек, которые
  // попали в область видимости — с небольшим запасом (rootMargin), чтобы
  // подгрузка начиналась чуть раньше, чем карточка реально попадёт на экран.
  // К моменту, когда человек нажмёт на фото, оно уже в кэше браузера и
  // просмотрщик открывает его мгновенно — независимо от скорости интернета
  // именно в этот момент. Ограничиваем число одновременных закачек, чтобы
  // не отбирать канал у самих превью в сетке.
  var prefetchedIds = {};
  var prefetchQueue = [];
  var prefetchActive = 0;
  var PREFETCH_CONCURRENCY = 3;

  function pumpPrefetchQueue(){
    while (prefetchActive < PREFETCH_CONCURRENCY && prefetchQueue.length){
      var url = prefetchQueue.shift();
      prefetchActive++;
      var img = new Image();
      var done = function(){ prefetchActive--; pumpPrefetchQueue(); };
      img.onload = done;
      img.onerror = done;
      img.src = url;
    }
  }

  function schedulePrefetch(urls){
    urls.forEach(function(url){ if (url) prefetchQueue.push(url); });
    pumpPrefetchQueue();
  }

  var prefetchObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      prefetchObserver.unobserve(entry.target);
      var id = entry.target.getAttribute('data-prefetch-id');
      if (!id || prefetchedIds[id]) return;
      prefetchedIds[id] = true;
      schedulePrefetch(entry.target.__prefetchUrls || []);
    });
  }, { rootMargin: '400px 0px' }) : null;

  // Пока каталог не загружен, показываем "дышащие" плейсхолдеры карточек —
  // это выглядит опрятнее пустого экрана и снижает ощущение подвисания.
  function renderSkeleton(){
    els.grid.innerHTML = '';
    els.empty.style.display = 'none';
    els.count.textContent = 'Загрузка каталога…';
    for (var i = 0; i < 8; i++) {
      var sk = document.createElement('div');
      sk.className = 'skeleton skeleton-card';
      els.grid.appendChild(sk);
    }
  }

  // Высота топбара может немного плавать (перенос строки поиска, длинное
  // название активной категории в чипсах) — поэтому меряем реально, а не
  // подставляем число руками, и держим это значение свежим через ResizeObserver.
  function updateTopbarHeight(){
    if (!els.topbar) return;
    document.documentElement.style.setProperty('--topbar-h', els.topbar.offsetHeight + 'px');
  }
  if (els.topbar && 'ResizeObserver' in window) {
    new ResizeObserver(updateTopbarHeight).observe(els.topbar);
  } else {
    window.addEventListener('resize', updateTopbarHeight);
  }
  updateTopbarHeight();

  var PAGE_SIZE = 40;

  function sortItems(items){
    var arr = items.slice();
    if (state.sort === 'name-asc') {
      arr.sort(function(a, b){ return a.name.localeCompare(b.name, 'ru'); });
    } else if (state.sort === 'name-desc') {
      arr.sort(function(a, b){ return b.name.localeCompare(a.name, 'ru'); });
    }
    // 'default' — порядок как в materials.json, не трогаем
    return arr;
  }

  function render(resetPage){
    if (resetPage !== false) state.visibleCount = PAGE_SIZE;

    var filtered = sortItems(state.items.filter(matches));
    els.count.textContent = filtered.length + ' материал(ов)';
    els.grid.innerHTML = '';
    els.empty.style.display = filtered.length ? 'none' : 'block';

    var visible = filtered.slice(0, state.visibleCount);

    // Заголовки-разделители категорий имеют смысл только когда лента реально
    // смешанная (весь каталог или избранное) — если выбрана одна конкретная
    // категория, все карточки и так из неё одной, заголовок был бы лишним.
    // При ручной сортировке по имени заголовки тоже отключаем — иначе один и
    // тот же заголовок появлялся бы много раз вперемешку по алфавиту.
    var showSectionHeaders = (state.favOnly || state.filterMode !== 'category') && state.sort === 'default';
    var lastCategory = null;

    visible.forEach(function(item, idx){
      if (showSectionHeaders && item.category !== lastCategory) {
        lastCategory = item.category;
        var headerEl = document.createElement('div');
        headerEl.className = 'section-header';
        headerEl.textContent = item.category;
        els.grid.appendChild(headerEl);
      }

      var site = siteGroupOf(item.category);
      var siteColor = (SITE_META[site] || {}).color || 'transparent';

      var card = document.createElement('div');
      card.className = 'card appear';
      card.setAttribute('data-site', site);
      // лёгкий "каскадный" эффект появления, без задержки для длинных списков
      card.style.animationDelay = Math.min(idx * 12, 240) + 'ms';

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      // Для карточки в сетке используем маленькое превью (item.thumb, ~400px),
      // а не полноразмерное фото — так грузится в разы быстрее и легче.
      // Фолбэки нужны для товаров, у которых materials.json ещё старого
      // формата (без поля thumb) — тогда используем то, что есть.
      var thumbSrc = item.thumb || (Array.isArray(item.images) && item.images[0]) || item.image;
      if (thumbSrc) {
        thumbWrap.classList.add('skeleton');
        var img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = item.name;
        img.onload = function(){ img.classList.add('loaded'); thumbWrap.classList.remove('skeleton'); };
        img.onerror = function(){
          console.error('[catalog] не удалось загрузить фото карточки:', thumbSrc, 'товар:', item.id);
          thumbWrap.classList.remove('skeleton');
          img.remove();
          var brokenEl = document.createElement('div');
          brokenEl.className = 'noimg';
          brokenEl.textContent = 'Фото недоступно';
          thumbWrap.insertBefore(brokenEl, thumbWrap.firstChild);
        };
        img.src = thumbSrc;
        thumbWrap.appendChild(img);
      } else {
        var noimg = document.createElement('div');
        noimg.className = 'noimg';
        noimg.textContent = item.name;
        thumbWrap.appendChild(noimg);
      }
      // Ставим карточку под наблюдение для фоновой предзагрузки полного
      // размера (первые 2 фото товара — этого достаточно для мгновенного
      // открытия основного вида, остальные слайды подгрузятся по свайпу).
      if (prefetchObserver) {
        var fullUrls = Array.isArray(item.images) && item.images.length
          ? item.images.slice(0, 2)
          : (item.image ? [item.image] : []);
        thumbWrap.setAttribute('data-prefetch-id', item.id);
        thumbWrap.__prefetchUrls = fullUrls;
        prefetchObserver.observe(thumbWrap);
      }

      // Передаём весь отфильтрованный список и позицию в нём — просмотрщик
      // использует это для вертикального свайпа между материалами, в том же
      // порядке, в котором они сейчас идут в сетке.
      thumbWrap.onclick = function(){ openViewer(visible, idx); };

      var heart = document.createElement('div');
      heart.className = 'heart' + (state.favorites.indexOf(item.id) >= 0 ? ' active' : '');
      heart.textContent = state.favorites.indexOf(item.id) >= 0 ? '♥' : '♡';
      heart.onclick = function(e){ e.stopPropagation(); toggleFavorite(item.id); };
      thumbWrap.appendChild(heart);

      // Копирование названия — маленькая иконка поверх фото (под сердечком),
      // а не отдельная полноширинная кнопка под каждой из 574 карточек.
      var copyIconBtn = document.createElement('div');
      copyIconBtn.className = 'copy-icon-btn';
      copyIconBtn.title = 'Скопировать название';
      copyIconBtn.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="9" y="9" width="12" height="12" rx="2"></rect>' +
        '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
        '</svg>';
      copyIconBtn.onclick = function(e){ e.stopPropagation(); copyText(item.name); };
      thumbWrap.appendChild(copyIconBtn);

      // Название и категория теперь лежат поверх фото (градиент снизу), а не в
      // отдельном текстовом блоке под ним — фото занимает всю карточку целиком,
      // текст не "откусывает" половину высоты у невысоких превью.
      var caption = document.createElement('div');
      caption.className = 'card-caption';
      var name = document.createElement('div');
      name.className = 'card-caption-name';
      name.textContent = item.name;
      var cat = document.createElement('div');
      cat.className = 'card-caption-cat';
      var dot = document.createElement('span');
      dot.className = 'source-dot';
      dot.style.background = siteColor;
      cat.appendChild(dot);
      cat.appendChild(document.createTextNode(item.category));
      caption.appendChild(name);
      caption.appendChild(cat);
      thumbWrap.appendChild(caption);

      card.appendChild(thumbWrap);
      els.grid.appendChild(card);
    });

    if (filtered.length > visible.length) {
      var more = document.createElement('div');
      more.className = 'load-more';
      more.textContent = 'Показать ещё (' + (filtered.length - visible.length) + ')';
      more.onclick = function(){
        state.visibleCount += PAGE_SIZE;
        render(false);
      };
      els.grid.appendChild(more);
    }
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
        try {
          if (tg && tg.showPopup && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
            tg.showPopup({ message: 'Скопировано: ' + text });
          } else {
            alert('Скопировано: ' + text);
          }
        } catch(e){ alert('Скопировано: ' + text); }
      });
    }
  }

  // ---- просмотрщик фото: живая drag-карусель вместо мгновенной смены src ----
  // Все фото товара рендерятся в один горизонтальный "трек"; во время свайпа
  // трек следует за пальцем без задержки, на отпускании — плавно доезжает
  // до соседнего кадра или пружинисто возвращается назад (rubber-band на краях).
  // viewerState.list/itemIdx — текущий отфильтрованный список материалов и
  // позиция в нём (для вертикального свайпа между материалами, см. ниже).
  // images/idx — фото ТЕКУЩЕГО материала и позиция в нём (горизонтальный свайп).
  var viewerState = { list: [], itemIdx: 0, images: [], idx: 0, currentItem: null };

  // Иконка ♡ во вьювере — та же логика избранного, что и на карточке
  // (state.favorites), просто отрисованная поверх полноэкранного фото.
  function updateViewerHeart(){
    var item = viewerState.currentItem;
    if (!item || !els.vheart) return;
    var isFav = state.favorites.indexOf(item.id) >= 0;
    els.vheart.className = 'vheart' + (isFav ? ' active' : '');
    els.vheart.textContent = isFav ? '♥' : '♡';
  }

  // ---- зум текущего фото во вьювере: пинч двумя пальцами + дабл-тап ----
  // Зум применяется трансформом прямо на .vfull текущего слайда, независимо
  // от translateX трека (тот двигает слайды между собой, этот — масштабирует
  // и панорамирует содержимое одного слайда). Сбрасывается при смене фото
  // (goToImage) и при открытии нового материала (renderViewerItem).
  var ZOOM_MIN = 1, ZOOM_MAX = 4, DOUBLE_TAP_SCALE = 2.5;
  var zoom = { scale: 1, x: 0, y: 0 };

  function getCurrentSlideImg(){
    var slide = els.vtrack.children[viewerState.idx];
    return slide ? slide.querySelector('.vfull') : null;
  }

  function clampPan(){
    var rect = els.vswipe.getBoundingClientRect();
    var maxX = (rect.width * (zoom.scale - 1)) / 2;
    var maxY = (rect.height * (zoom.scale - 1)) / 2;
    zoom.x = Math.max(-maxX, Math.min(maxX, zoom.x));
    zoom.y = Math.max(-maxY, Math.min(maxY, zoom.y));
  }

  function applyZoom(animate){
    var img = getCurrentSlideImg();
    if (!img) return;
    img.style.transition = animate ? 'transform .2s ease' : 'none';
    img.style.transform = 'translate(' + zoom.x + 'px,' + zoom.y + 'px) scale(' + zoom.scale + ')';
    // Пока фото увеличено — одиночный палец панорамирует картинку вместо
    // обычного свайпа между фото/материалами (см. initViewerGestures).
    els.vitem.classList.toggle('zoomed', zoom.scale > 1);
  }

  function resetZoom(animate){
    zoom.scale = 1; zoom.x = 0; zoom.y = 0;
    applyZoom(animate);
  }

  function setTrackTransform(px, animate){
    els.vtrack.style.transition = animate ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
    els.vtrack.style.transform = 'translateX(calc(' + (-viewerState.idx * 100) + '% + ' + px + 'px))';
  }

  function updateViewerChrome(){
    var imgs = viewerState.images, idx = viewerState.idx;
    els.vdots.innerHTML = '';
    if (imgs.length > 1){
      imgs.forEach(function(_, i){
        var dot = document.createElement('div');
        dot.className = 'vdot' + (i === idx ? ' active' : '');
        els.vdots.appendChild(dot);
      });
    }
    els.vprev.className = 'vnavbtn' + (idx === 0 ? ' hidden' : '');
    els.vnext.className = 'vnavbtn' + (idx >= imgs.length - 1 ? ' hidden' : '');
  }

  function goToImage(newIdx, animate){
    viewerState.idx = Math.max(0, Math.min(newIdx, viewerState.images.length - 1));
    setTrackTransform(0, animate !== false);
    updateViewerChrome();
    resetZoom(false); // новое фото всегда открывается без зума с прошлого
  }

  // Строит слайды (фото + blur-up превью) для ОДНОГО материала — используется
  // и при первом открытии просмотрщика, и при переходе на соседний материал
  // вертикальным свайпом (тогда просто пересобираем содержимое на месте).
  function renderViewerItem(item){
    var imgs = Array.isArray(item.images) && item.images.length ? item.images : (item.image ? [item.image] : []);
    var thumbs = Array.isArray(item.thumbs) && item.thumbs.length ? item.thumbs : (item.thumb ? [item.thumb] : []);
    viewerState.images = imgs;
    viewerState.idx = 0;
    viewerState.currentItem = item;
    console.log('[catalog] открыт просмотрщик:', item.id, '— фото:', imgs.length);

    els.vtrack.innerHTML = '';
    imgs.forEach(function(src, i){
      var slide = document.createElement('div');
      slide.className = 'vslide';

      // blur-up: своё маленькое превью на этот слайд (обычно уже в кэше
      // браузера — либо с сетки карточек, либо благодаря фоновой
      // предзагрузке, см. schedulePrefetch) показываем сразу и размытым,
      // пока рядом тихо грузится полный размер.
      var thumbSrc = thumbs[i];
      if (thumbSrc && thumbSrc !== src) {
        var thumbImg = document.createElement('img');
        thumbImg.className = 'vthumb';
        thumbImg.alt = '';
        thumbImg.draggable = false;
        thumbImg.src = thumbSrc;
        slide.appendChild(thumbImg);
      }

      var fullImg = document.createElement('img');
      fullImg.className = 'vfull';
      fullImg.alt = item.name;
      fullImg.draggable = false;
      fullImg.onload = function(){ fullImg.classList.add('loaded'); };
      fullImg.onerror = function(){
        console.error('[catalog] не удалось загрузить фото во вьювере:', src, 'товар:', item.id);
        slide.innerHTML =
          '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
          'color:#bbb;font-size:13px;">Фото недоступно</div>';
      };
      fullImg.src = src;
      slide.appendChild(fullImg);

      els.vtrack.appendChild(slide);
    });
    setTrackTransform(0, false);
    updateViewerChrome();
    zoom.scale = 1; zoom.x = 0; zoom.y = 0; // без applyZoom — слайды только что пересозданы

    els.vname.textContent = item.name;
    els.vcat.textContent = item.category;
    els.vcopy.onclick = function(){ copyText(item.name); };
    updateViewerHeart();
    els.vheart.onclick = function(){ toggleFavorite(item.id); };
  }

  // list — та же отфильтрованная лента, что сейчас отрендерена в сетке (см.
  // вызов openViewer(filtered, idx) в render()); idx — индекс материала,
  // по фото которого тапнули. Так вертикальный свайп двигается ровно по
  // тому же порядку, в котором человек листал сетку.
  function openViewer(list, idx){
    viewerState.list = list;
    viewerState.itemIdx = idx;
    els.vitem.style.transition = 'none';
    els.vitem.style.transform = 'translateY(0)';
    renderViewerItem(list[idx]);
    els.viewer.classList.add('open');
  }

  function snapItemBack(){
    els.vitem.style.transition = 'transform .25s ease';
    els.vitem.style.transform = 'translateY(0)';
  }

  // Переход к следующему/предыдущему материалу БЕЗ выхода из просмотрщика:
  // текущее содержимое уезжает по вертикали за экран, затем на его место
  // подставляется соседний материал — не нужно закрывать/открывать вьювер
  // заново, чтобы посмотреть следующий.
  function goToVerticalItem(direction){
    var newIdx = viewerState.itemIdx + direction;
    if (newIdx < 0 || newIdx >= viewerState.list.length) { snapItemBack(); return; }
    var vitem = els.vitem;
    vitem.style.transition = 'transform .25s ease';
    vitem.style.transform = 'translateY(' + (direction > 0 ? '-100%' : '100%') + ')';
    var onDone = function(){
      vitem.removeEventListener('transitionend', onDone);
      viewerState.itemIdx = newIdx;
      renderViewerItem(viewerState.list[newIdx]);
      vitem.style.transition = 'none';
      vitem.style.transform = 'translateY(0)';
    };
    vitem.addEventListener('transitionend', onDone);
  }

  els.vprev.onclick = function(e){ e.stopPropagation(); goToImage(viewerState.idx - 1); };
  els.vnext.onclick = function(e){ e.stopPropagation(); goToImage(viewerState.idx + 1); };

  // Один обработчик на несколько независимых жестов:
  // - одним пальцем при zoom.scale===1: горизонтальный свайп листает фото
  //   текущего материала, вертикальный — переключает сам материал (как раньше);
  // - одним пальцем при zoom.scale>1: панорамирование увеличенного фото
  //   (свайп/переключение материала в этот момент отключены);
  // - двумя пальцами: пинч-зум;
  // - двойной тап: приблизить до DOUBLE_TAP_SCALE / вернуть к 1x.
  // Ось обычного свайпа определяется один раз за жест по первому заметному
  // движению и дальше не меняется — эта часть логики не тронута.
  (function initViewerGestures(){
    var drag = null;
    var pinch = null;
    var pan = null;
    var lastTap = { time: 0, x: 0, y: 0 };

    function touchDist(t0, t1){
      var dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function zoomAtPoint(clientX, clientY, targetScale){
      var rect = els.vswipe.getBoundingClientRect();
      var offsetX = clientX - rect.left - rect.width / 2;
      var offsetY = clientY - rect.top - rect.height / 2;
      // Пересчитываем панорамирование так, чтобы точка под пальцем/тапом
      // осталась на месте при изменении масштаба.
      var factor = targetScale / zoom.scale;
      zoom.x = (zoom.x - offsetX) * factor + offsetX;
      zoom.y = (zoom.y - offsetY) * factor + offsetY;
      zoom.scale = targetScale;
      clampPan();
    }

    els.vitem.addEventListener('touchstart', function(e){
      if (e.touches.length === 2) {
        drag = null; pan = null;
        pinch = {
          startDist: touchDist(e.touches[0], e.touches[1]) || 1,
          startScale: zoom.scale
        };
        return;
      }
      pinch = null;
      var t = e.touches[0];
      if (zoom.scale > 1) {
        pan = { startX: t.clientX, startY: t.clientY, origX: zoom.x, origY: zoom.y };
        drag = null;
      } else {
        pan = null;
        drag = { startX: t.clientX, startY: t.clientY, dx: 0, dy: 0, locked: null };
      }
    }, {passive:true});

    els.vitem.addEventListener('touchmove', function(e){
      if (pinch && e.touches.length === 2) {
        var dist = touchDist(e.touches[0], e.touches[1]) || 1;
        var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        var targetScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinch.startScale * (dist / pinch.startDist)));
        zoomAtPoint(midX, midY, targetScale);
        applyZoom(false);
        return;
      }
      if (pan) {
        var t = e.touches[0];
        zoom.x = pan.origX + (t.clientX - pan.startX);
        zoom.y = pan.origY + (t.clientY - pan.startY);
        clampPan();
        applyZoom(false);
        return;
      }
      if (!drag) return;
      var t2 = e.touches[0];
      var dx = t2.clientX - drag.startX;
      var dy = t2.clientY - drag.startY;
      if (drag.locked === null) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        drag.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if (drag.locked === 'x') {
        if (viewerState.images.length < 2) return;
        var atStart = viewerState.idx === 0 && dx > 0;
        var atEnd = viewerState.idx === viewerState.images.length - 1 && dx < 0;
        drag.dx = (atStart || atEnd) ? dx * 0.35 : dx;
        setTrackTransform(drag.dx, false);
      } else {
        var atFirst = viewerState.itemIdx === 0 && dy > 0;
        var atLast = viewerState.itemIdx === viewerState.list.length - 1 && dy < 0;
        drag.dy = (atFirst || atLast) ? dy * 0.35 : dy;
        els.vitem.style.transition = 'none';
        els.vitem.style.transform = 'translateY(' + drag.dy + 'px)';
      }
    }, {passive:true});

    els.vitem.addEventListener('touchend', function(e){
      if (pinch) {
        // Обе точки контакта подняты (или осталась одна) — фиксируем зум как есть.
        if (e.touches.length < 2) pinch = null;
        return;
      }
      if (pan) {
        pan = null;
        return;
      }
      if (!drag) return;

      // Тап без заметного движения — кандидат на двойной тап (зум).
      if (drag.locked === null) {
        var now = Date.now();
        var tapX = drag.startX, tapY = drag.startY;
        var isDouble = (now - lastTap.time) < 300 &&
          Math.abs(tapX - lastTap.x) < 30 && Math.abs(tapY - lastTap.y) < 30;
        if (isDouble) {
          if (zoom.scale > 1) {
            resetZoom(true);
          } else {
            zoomAtPoint(tapX, tapY, DOUBLE_TAP_SCALE);
            applyZoom(true);
          }
          lastTap.time = 0;
        } else {
          lastTap = { time: now, x: tapX, y: tapY };
        }
        drag = null;
        return;
      }

      if (drag.locked === 'x') {
        var w = els.vswipe.clientWidth || 300;
        if (drag.dx <= -w * 0.18) goToImage(viewerState.idx + 1);
        else if (drag.dx >= w * 0.18) goToImage(viewerState.idx - 1);
        else goToImage(viewerState.idx);
      } else if (drag.locked === 'y') {
        var h = els.vitem.clientHeight || 500;
        if (drag.dy <= -h * 0.16) goToVerticalItem(1);
        else if (drag.dy >= h * 0.16) goToVerticalItem(-1);
        else snapItemBack();
      }
      drag = null;
    });
  })();

  els.vclose.onclick = function(){ els.viewer.classList.remove('open'); };

  var searchTimer;
  els.search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var val = els.search.value;
    searchTimer = setTimeout(function(){
      state.query = val;
      render();
      buildSearchSuggestions(val);
    }, 150);
  });

  // ---- подсказки-категории по мере ввода — при 500+ позициях быстрее
  // найти нужный раздел по названию категории, чем листать вкладки ----
  function buildSearchSuggestions(query){
    var q = query.trim().toLowerCase();
    if (!q) {
      els.searchSuggest.className = 'search-suggest';
      els.searchSuggest.innerHTML = '';
      return;
    }
    var counts = {}; // название категории -> количество
    state.items.forEach(function(it){
      if (it.category.toLowerCase().indexOf(q) !== -1) {
        counts[it.category] = (counts[it.category] || 0) + 1;
      }
    });
    var names = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; }).slice(0, 8);
    if (!names.length) {
      els.searchSuggest.className = 'search-suggest';
      els.searchSuggest.innerHTML = '';
      return;
    }
    els.searchSuggest.className = 'search-suggest show';
    els.searchSuggest.innerHTML = '';
    names.forEach(function(name){
      var chip = document.createElement('div');
      chip.className = 'suggest-chip';
      chip.innerHTML = '<span>' + name + '</span><span class="n">' + counts[name] + '</span>';
      chip.onclick = function(){
        state.filterMode = 'category';
        state.activeSite = siteGroupOf(name);
        state.category = name;
        state.query = '';
        els.search.value = '';
        els.searchSuggest.className = 'search-suggest';
        els.searchSuggest.innerHTML = '';
        applyFilterChange();
      };
      els.searchSuggest.appendChild(chip);
    });
  }

  // ---- стартовый экран (splash) ----
  // Показывается только при первом запуске приложения. localStorage уже
  // проверен синхронно в самом начале body (чтобы не мигало), здесь —
  // авторитетная проверка через CloudStorage (та же схема, что и у
  // избранного) плюс сама логика закрытия по тапу на "Каталог".
  function initSplash(){
    var splashEl = document.getElementById('splash');
    var ctaEl = document.getElementById('splashCta');
    if (!splashEl) return;

    function hideSplash(animate){
      if (splashEl.style.display === 'none') return;
      if (animate) {
        splashEl.classList.add('fade-out');
        setTimeout(function(){ splashEl.style.display = 'none'; }, 350);
      } else {
        splashEl.style.display = 'none';
      }
    }

    function markSplashSeen(){
      try { localStorage.setItem('splash_seen', '1'); } catch(e){}
      if (cloudStorageAvailable()) {
        try { tg.CloudStorage.setItem('splash_seen', '1', function(){}); } catch(e){}
      }
    }

    // Если сплэш уже видели на другом устройстве (CloudStorage) — закрываем
    // без анимации, даже если локально на этом устройстве флага ещё не было.
    if (cloudStorageAvailable()) {
      try {
        tg.CloudStorage.getItem('splash_seen', function(err, value){
          if (!err && value === '1') hideSplash(false);
        });
      } catch(e){}
    }

    if (ctaEl) {
      ctaEl.onclick = function(){
        markSplashSeen();
        hideSplash(true);
      };
    }
  }

  renderSkeleton();
  loadFavorites(loadCatalog);
  initSplash();
})();
</script>
</body>
</html>
