<script>
(function(){
  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      // Настройка в BotFather задаёт только режим ПО УМОЛЧАНИЮ, которым
      // Telegram предлагает открыть мини-апп — сама по себе она не переводит
      // уже открытое приложение в fullscreen. Это должен явно сделать код
      // приложения через Bot API 8.0+. Там, где requestFullscreen()
      // недоступен (старые клиенты), остаёмся на expand() — раньше он был
      // единственным вызовом.
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) {
        tg.requestFullscreen();
      } else {
        tg.expand();
      }
    } catch(e){}
    // По умолчанию Telegram трактует свайп вниз (в том числе просто скролл
    // ленты карточек к началу списка) как жест "потянуть мини-апп вниз,
    // свернуть" — это и была причина того, что верхние элементы "утягивало"
    // при свайпе вниз. Отключаем этот системный жест (Bot API 7.7+), чтобы
    // вертикальный скролл всегда оставался просто скроллом.
    try {
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
        tg.disableVerticalSwipes();
      }
    } catch(e){}
  }

  // ---- safe area: в fullscreen Telegram рисует СВОИ контролы (Закрыть слева,
  // стрелка/меню справа) поверх верхней полосы экрана — это не элементы
  // нашего DOM, подвинуть их нельзя, поэтому вместо этого подстраиваем СВОЙ
  // топбар/вьювер под них через contentSafeAreaInset (Bot API 8.0+, то же
  // поле, что уже проверяется перед requestFullscreen). Значение приходит от
  // самого Telegram под конкретное устройство/версию клиента — не число,
  // подобранное вручную под один телефон, поэтому одинаково корректно
  // работает у любого пользователя. SAFE_AREA_BUFFER — небольшой запас
  // сверху: на практике contentSafeAreaInset иногда чуть меньше того, что
  // реально занимают контролы Telegram визуально, лучше отступить чуть больше.
  var SAFE_AREA_BUFFER = 24;
  function applySafeArea(){
    var root = document.documentElement.style;
    var safeTop = (tg && tg.safeAreaInset && tg.safeAreaInset.top) || 0;
    var contentTop = (tg && tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0;
    var top = Math.max(safeTop, contentTop);
    root.setProperty('--content-safe-top', (top ? top + SAFE_AREA_BUFFER : 0) + 'px');
  }
  if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) {
    applySafeArea();
    // Меняется при повороте экрана, сворачивании/разворачивании и т.п. —
    // держим переменные свежими, а не считаем один раз при загрузке.
    try {
      tg.onEvent('safeAreaChanged', applySafeArea);
      tg.onEvent('contentSafeAreaChanged', applySafeArea);
    } catch(e){}
  }

  var state = {
    items: [],
    category: 'Все',
    activeSite: null, // ключ источника (emc/adilet/interstone) — фильтр по ВСЕМ его категориям разом (см. quick-row), в отличие от category — фильтра по ОДНОЙ конкретной категории
    favOnly: false,
    query: '',
    favorites: [],
    expandedGroups: {},
    theme: null // выставляется в initTheme()/applyTheme() ниже
  };

  var els = {
    topbar: document.querySelector('.topbar'),
    grid: document.getElementById('grid'),
    favBtn: document.getElementById('favBtn'),
    menuBtn: document.getElementById('menuBtn'),
    drawerOverlay: document.getElementById('drawerOverlay'),
    drawer: document.getElementById('drawer'),
    drawerClose: document.getElementById('drawerClose'),
    drawerAll: document.getElementById('drawerAll'),
    drawerFav: document.getElementById('drawerFav'),
    drawerGroups: document.getElementById('drawerGroups'),
    search: document.getElementById('search'),
    count: document.getElementById('count'),
    empty: document.getElementById('empty'),
    viewer: document.getElementById('viewer'),
    vitem: document.getElementById('vitem'),
    vswipe: document.getElementById('vswipe'),
    vtrack: document.getElementById('vtrack'),
    vdots: document.getElementById('vdots'),
    vprev: document.getElementById('vprev'),
    vnext: document.getElementById('vnext'),
    vname: document.getElementById('vname'),
    vcat: document.getElementById('vcat'),
    vcopy: document.getElementById('vcopy'),
    vheart: document.getElementById('vheart'),
    vclose: document.getElementById('vclose'),
    topCatBtn: document.getElementById('topCatBtn'),
    topCatBtnLabel: document.getElementById('topCatBtnLabel'),
    quickRow: document.getElementById('quickRow'),
    themeSwitcher: document.getElementById('themeSwitcher')
  };

  // ---- переключатель тем (временный, см. комментарий у #themeSwitcher в
  // разметке) — каждая тема просто набор CSS-переменных, которые целиком
  // подставляются в :root через applyTheme(). Ничего, кроме custom
  // properties, не трогаем — все селекторы уже и так используют var(...). */
  var THEMES = {
    clouddancer: {
      name: 'Cloud Dancer (светлый премиум)',
      vars: {
        '--bg': '#EDE8E0', '--text': '#2B2620', '--hint': '#7D7263', '--hint-strong': '#55493C',
        '--link': '#A84E1A', '--button': '#A84E1A', '--button-text': '#ffffff',
        '--secbg': '#FFFFFF', '--line': '#DED4C4', '--quickrow-bg': '#DDD5C8',
        '--safetop-tint-rgb': '255,255,255', '--splash-tint-rgb': '255,255,255'
      }
    },
    warmstone: {
      name: 'Тёплый камень',
      vars: {
        '--bg': '#948A7E', '--text': '#241F1A', '--hint': '#7D7367', '--hint-strong': '#332C25',
        '--link': '#9B5215', '--button': '#9B5215', '--button-text': '#ffffff',
        '--secbg': '#FBF8F4', '--line': '#DDD5C8', '--quickrow-bg': '#C7BDAF',
        '--safetop-tint-rgb': '251,248,244', '--splash-tint-rgb': '251,248,244'
      }
    },
    darkpremium: {
      name: 'Тёмный премиум',
      vars: {
        '--bg': '#211E1C', '--text': '#EDE7DF', '--hint': '#A69C8E', '--hint-strong': '#C7BFB3',
        '--link': '#D97B4F', '--button': '#D97B4F', '--button-text': '#211E1C',
        '--secbg': '#2C2825', '--line': '#4A433C', '--quickrow-bg': '#33302B',
        '--safetop-tint-rgb': '44,40,37', '--splash-tint-rgb': '44,40,37'
      }
    },
    latte: {
      name: 'Кофе с молоком',
      vars: {
        '--bg': '#E8DFD3', '--text': '#3B2E24', '--hint': '#7C6C59', '--hint-strong': '#4C3E30',
        '--link': '#7A4E24', '--button': '#7A4E24', '--button-text': '#ffffff',
        '--secbg': '#FFFDF9', '--line': '#D3C6B2', '--quickrow-bg': '#D8CBB8',
        '--safetop-tint-rgb': '255,253,249', '--splash-tint-rgb': '255,253,249'
      }
    },
    emerald: {
      name: 'Изумрудная роскошь',
      vars: {
        '--bg': '#F3EFE6', '--text': '#1E2A22', '--hint': '#5E6A60', '--hint-strong': '#2E3D33',
        '--link': '#116B45', '--button': '#116B45', '--button-text': '#ffffff',
        '--secbg': '#FDFCFA', '--line': '#D2CAB5', '--quickrow-bg': '#D4C9B0',
        '--safetop-tint-rgb': '253,252,250', '--splash-tint-rgb': '253,252,250'
      }
    },
    indigo: {
      name: 'Полночный индиго',
      vars: {
        '--bg': '#1B1A2E', '--text': '#EDEAF5', '--hint': '#A19BC0', '--hint-strong': '#B5B0CC',
        '--link': '#BE8749', '--button': '#BE8749', '--button-text': '#1B1A2E',
        '--secbg': '#2E2C4D', '--line': '#454268', '--quickrow-bg': '#3A3768',
        '--safetop-tint-rgb': '46,44,77', '--splash-tint-rgb': '46,44,77'
      }
    }
  };
  var THEME_ORDER = ['clouddancer', 'warmstone', 'darkpremium', 'latte', 'emerald', 'indigo'];
  var THEME_STORAGE_KEY = 'catalog_theme';

  function applyTheme(key){
    var theme = THEMES[key];
    if (!theme) return;
    var root = document.documentElement.style;
    Object.keys(theme.vars).forEach(function(k){ root.setProperty(k, theme.vars[k]); });
    state.theme = key;
    try { localStorage.setItem(THEME_STORAGE_KEY, key); } catch(e){}
    buildThemeSwitcher();
  }

  function buildThemeSwitcher(){
    if (!els.themeSwitcher) return;
    els.themeSwitcher.innerHTML = '';
    THEME_ORDER.forEach(function(key){
      var theme = THEMES[key];
      var item = document.createElement('div');
      item.className = 'theme-item' + (state.theme === key ? ' active' : '');
      item.innerHTML =
        '<div class="theme-swatch" style="background:' + theme.vars['--bg'] + '">' +
          '<div class="tsw-accent" style="background:' + theme.vars['--button'] + '"></div>' +
        '</div>' +
        '<div class="theme-name">' + theme.name + '</div>' +
        (state.theme === key ? '<div class="theme-check">✓</div>' : '');
      item.onclick = function(){ applyTheme(key); };
      els.themeSwitcher.appendChild(item);
    });
  }

  (function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_STORAGE_KEY); } catch(e){}
    applyTheme((saved && THEMES[saved]) ? saved : 'clouddancer');
  })();

  // ---- группировка категорий по сайтам-источникам (для боковой шторки) ----
  // Категории неймспейсятся по префиксу названия — это позволяет добавлять
  // новые сайты/категории в скрапере без правок фронтенда: всё, что не
  // "ПВХ плёнка: ..." и не "Акриловый камень ...", считается материалами em-c.kz.
  function siteGroupOf(cat){
    if (cat.indexOf('ПВХ плёнка') === 0) return 'adilet';
    if (cat.indexOf('Акриловый камень') === 0) return 'interstone';
    return 'emc';
  }
  // Цвета точек-источников подобраны так, чтобы не сливались с золотым
  // акцентом --button и хорошо читались на светло-серой/белой поверхности.
  var SITE_META = {
    emc: { title: 'EM-C.KZ', subtitle: 'Листовые материалы', color: '#6fa3d8' },
    adilet: { title: 'ADILET.NET', subtitle: 'Плёнка ПВХ', color: '#d98f4e' },
    interstone: { title: 'INTERSTONE.KZ', subtitle: 'Акриловый камень', color: '#6b7580' }
  };
  var SITE_ORDER = ['emc', 'adilet', 'interstone'];

  // Общая для шторки/select'а/иконок-ярлыков группировка: сколько категорий
  // и товаров у каждого источника. Считаем один раз и переиспользуем вместо
  // трёх одинаковых циклов по state.items в разных builder-функциях.
  function computeSourceGroups(){
    var groups = {}; // ключ сайта -> { cats: {название: количество}, total: n }
    state.items.forEach(function(it){
      var g = siteGroupOf(it.category);
      if (!groups[g]) groups[g] = { cats: {}, total: 0 };
      groups[g].total++;
      groups[g].cats[it.category] = (groups[g].cats[it.category] || 0) + 1;
    });
    return groups;
  }

  // ---- избранное: Telegram CloudStorage с фоллбеком на localStorage ----
  // CloudStorage доступен не во всех версиях клиента Telegram (и отсутствует
  // вовсе при открытии страницы вне Telegram) — вызов может синхронно кинуть
  // исключение ("WebAppMethodUnsupported"), поэтому всё оборачиваем в try/catch.
  function cloudStorageAvailable(){
    return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  }

  function loadFavorites(cb){
    if (cloudStorageAvailable()) {
      try {
        tg.CloudStorage.getItem('favorites', function(err, value){
          if (!err && value) {
            try { state.favorites = JSON.parse(value); } catch(e){ state.favorites = []; }
          }
          cb();
        });
      } catch (e) {
        loadFavoritesLocal();
        cb();
      }
    } else {
      loadFavoritesLocal();
      cb();
    }
  }

  function loadFavoritesLocal(){
    try { state.favorites = JSON.parse(localStorage.getItem('favorites') || '[]'); } catch(e){ state.favorites = []; }
  }

  function saveFavorites(){
    var json = JSON.stringify(state.favorites);
    if (cloudStorageAvailable()) {
      try { tg.CloudStorage.setItem('favorites', json, function(){}); }
      catch (e) { localStorage.setItem('favorites', json); }
    } else {
      localStorage.setItem('favorites', json);
    }
  }

  function toggleFavorite(id){
    var idx = state.favorites.indexOf(id);
    if (idx >= 0) state.favorites.splice(idx, 1);
    else state.favorites.push(id);
    saveFavorites();
    render();
    // Вьювер — отдельный оверлей поверх сетки, render() его не трогает,
    // поэтому сердечко в нём синхронизируем отдельно (если вьювер открыт).
    updateViewerHeart();
  }

  // ---- загрузка каталога ----
  function loadCatalog(){
    fetch('data/materials.json', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        console.log('[catalog] каталог загружен:', data.length, 'позиций');
        state.items = data;
        updateFavBtn();
        updateTopCatSelectValue();
        buildDrawer();
        buildQuickRow();
        render();
        // Реальное число материалов вместо статичной цифры на сплэше —
        // актуально всегда, даже когда каталог пополняется скрапером.
        var splashEyebrow = document.getElementById('splashEyebrow');
        if (splashEyebrow) {
          splashEyebrow.textContent = data.length + ' материалов · ' + SITE_ORDER.length + ' источника';
        }
      })
      .catch(function(err){
        console.error('[catalog] ошибка загрузки materials.json:', err);
        els.empty.style.display = 'block';
        els.empty.textContent = 'Не удалось загрузить каталог';
      });
  }

  // ---- кнопка "Избранное" в топбаре — просто вкл/выкл фильтр по избранному ----
  function updateFavBtn(){
    els.favBtn.className = 'fav-btn' + (state.favOnly ? ' active' : '');
    els.favBtn.textContent = state.favOnly ? '★ Избранное' : '☆ Избранное';
  }
  els.favBtn.onclick = function(){
    state.favOnly = !state.favOnly;
    render();
    updateFavBtn();
    updateTopCatSelectValue();
    buildDrawer();
    buildQuickRow();
  };

  // ---- компактный выбор категории прямо в топбаре (третья строка) ----
  // Второй, отдельный от боковой шторки вход в тот же фильтр. Раньше здесь
  // был нативный <select> — но открытый список select'а рисует ОС/браузер,
  // а не наш CSS, поэтому он выглядел тёмным и чужеродным на светлой теме
  // (несовместимо с остальным приложением). Заменили на кнопку + свой
  // popover в том же визуальном стиле, что и у иконок снизу (.quick-popover) —
  // полностью наш дизайн, без системного рендера.
  els.topCatBtn.onclick = function(){
    if (topCatPopoverOpen) { closeTopCatPopover(); return; }
    openTopCatPopover();
  };

  var topCatPopoverOpen = false;

  function closeTopCatPopover(){
    topCatPopoverOpen = false;
    if (els.topCatPopover) { els.topCatPopover.remove(); els.topCatPopover = null; }
    if (els.topCatPopoverBackdrop) { els.topCatPopoverBackdrop.remove(); els.topCatPopoverBackdrop = null; }
  }

  function openTopCatPopover(){
    closeTopCatPopover();
    closeQuickPopover();
    topCatPopoverOpen = true;

    var backdrop = document.createElement('div');
    backdrop.className = 'quick-popover-backdrop';
    backdrop.onclick = closeTopCatPopover;
    document.body.appendChild(backdrop);
    els.topCatPopoverBackdrop = backdrop;

    var pop = document.createElement('div');
    pop.className = 'top-cat-popover';

    function addRow(text, count, isActive, onClick){
      var row = document.createElement('div');
      row.className = 'quick-popover-item' + (isActive ? ' active' : '');
      row.innerHTML = '<span>' + text + '</span>' + (count != null ? '<span class="n">' + count + '</span>' : '');
      row.onclick = onClick;
      pop.appendChild(row);
    }

    addRow('Все материалы', null, state.category === 'Все' && !state.activeSite && !state.favOnly, function(){
      state.category = 'Все'; state.activeSite = null; state.favOnly = false;
      render(); updateFavBtn(); updateTopCatSelectValue(); buildDrawer(); buildQuickRow();
      closeTopCatPopover();
    });
    addRow('★ Избранное', null, state.favOnly, function(){
      state.favOnly = !state.favOnly;
      render(); updateFavBtn(); updateTopCatSelectValue(); buildDrawer(); buildQuickRow();
      closeTopCatPopover();
    });

    var groups = computeSourceGroups();
    SITE_ORDER.forEach(function(key){
      var g = groups[key];
      if (!g) return;
      // Пользователю не важно, с какого сайта пришли данные — важно, что за
      // материал внутри (см. аналогичное решение в шторке/иконках).
      var meta = SITE_META[key] || { subtitle: key };
      var catNames = Object.keys(g.cats).sort();

      var label = document.createElement('div');
      label.className = 'drawer-section-label';
      label.textContent = meta.subtitle;
      pop.appendChild(label);

      if (catNames.length > 1) {
        addRow('Всё', g.total, !state.favOnly && state.activeSite === key, function(){
          state.activeSite = key; state.category = 'Все'; state.favOnly = false;
          render(); updateFavBtn(); updateTopCatSelectValue(); buildDrawer(); buildQuickRow();
          closeTopCatPopover();
        });
      }
      catNames.forEach(function(catName){
        addRow(catName, g.cats[catName], !state.favOnly && !state.activeSite && state.category === catName, function(){
          state.category = catName; state.activeSite = null; state.favOnly = false;
          render(); updateFavBtn(); updateTopCatSelectValue(); buildDrawer(); buildQuickRow();
          closeTopCatPopover();
        });
      });
    });

    document.body.appendChild(pop);
    els.topCatPopover = pop;

    // Раскрывается ПОД кнопкой, во всю её ширину.
    var rect = els.topCatBtn.getBoundingClientRect();
    pop.style.left = rect.left + 'px';
    pop.style.width = rect.width + 'px';
    pop.style.top = (rect.bottom + 6) + 'px';
  }

  // Список внутри popover'а пересобирается заново при каждом открытии
  // (openTopCatPopover), поэтому здесь достаточно только обновить подпись
  // на самой кнопке — то, что раньше делал updateTopCatSelectValue() для
  // select'а (имя функции оставлено прежним — вызывается из многих мест).
  function updateTopCatSelectValue(){
    if (state.favOnly) els.topCatBtnLabel.textContent = '★ Избранное';
    else if (state.activeSite) els.topCatBtnLabel.textContent = QUICK_LABELS[state.activeSite] || state.activeSite;
    else if (state.category === 'Все') els.topCatBtnLabel.textContent = 'Все материалы';
    else els.topCatBtnLabel.textContent = state.category;
  }

  // ---- быстрые иконки-ярлыки снизу экрана — третий, ещё более компактный
  // вход в тот же фильтр. Если у источника только одна категория — тап сразу
  // применяет фильтр по всему источнику (state.activeSite). Если категорий
  // несколько (сейчас это плёнка ПВХ) — тап открывает всплывающее мини-меню
  // прямо над иконкой с выбором конкретной категории (или "Всё" по
  // источнику целиком) — иначе непонятно, что именно за материал скрыт за
  // одной иконкой. Иконки и подписи — свои, не скопированы из чужих
  // приложений/сайтов. ----
  // Иконки переработаны так, чтобы форма читалась как материал, а не абстрактная
  // геометрия: ЛДСП — стопка слоёв (плита из спрессованных слоёв), Плёнка —
  // лист с загнутым уголком (плёнка/наклейка, которую отклеивают за уголок),
  // Камень — обкатанный, "каменный" контур вместо острого геометрического ромба.
  // Плёнка и Камень — по референсным картинкам, которые прислал пользователь
  // (рулон плёнки — вытянутый по горизонтали, как рулон обоев/ткани, а не
  // короткая вертикальная трубка (та читалась как туалетная бумага);
  // каменная арка-трилит вроде Стоунхенджа). Перерисованы в том же
  // монохромном line-стиле (stroke = currentColor), что и остальные иконки
  // ряда — так активное состояние (.quick-item.active{color:var(--button)})
  // продолжает перекрашивать иконку целиком, без отдельного набора цветов
  // только для одной иконки.
  var QUICK_ICONS = {
    emc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 21 8 12 13 3 8 12 3"></polygon><polyline points="3 12 12 17 21 12"></polyline><polyline points="3 16 12 21 21 16"></polyline></svg>',
    adilet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7.5" width="18.5" height="9" rx="4.5"></rect><ellipse cx="6.3" cy="12" rx="2.4" ry="4.3"></ellipse><ellipse cx="6.3" cy="12" rx="0.9" ry="1.7"></ellipse></svg>',
    interstone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="3" height="8.5" rx="0.8"></rect><rect x="16" y="9" width="3" height="8.5" rx="0.8"></rect><rect x="4.5" y="5.2" width="15" height="3.6" rx="1"></rect><line x1="3" y1="18.5" x2="21" y2="18.5"></line></svg>'
  };
  var QUICK_LABELS = { emc: 'ЛДСП', adilet: 'Плёнка', interstone: 'Камень' };

  var quickPopoverOpenSite = null;

  function closeQuickPopover(){
    if (els.quickPopover) { els.quickPopover.remove(); els.quickPopover = null; }
    if (els.quickPopoverBackdrop) { els.quickPopoverBackdrop.remove(); els.quickPopoverBackdrop = null; }
    quickPopoverOpenSite = null;
  }

  // anchorBtn — кнопка-иконка, над которой всплывает меню; g/catNames — те
  // же данные, что уже посчитаны в buildQuickRow (не пересчитываем заново).
  function openQuickPopover(key, anchorBtn, g, catNames){
    closeQuickPopover();
    closeTopCatPopover();
    quickPopoverOpenSite = key;

    var backdrop = document.createElement('div');
    backdrop.className = 'quick-popover-backdrop';
    backdrop.onclick = closeQuickPopover;
    document.body.appendChild(backdrop);
    els.quickPopoverBackdrop = backdrop;

    var pop = document.createElement('div');
    pop.className = 'quick-popover';

    var allItem = document.createElement('div');
    var allActive = !state.favOnly && (state.activeSite === key || (!state.activeSite && state.category === 'Все'));
    allItem.className = 'quick-popover-item' + (allActive ? ' active' : '');
    allItem.innerHTML = '<span>Всё (' + QUICK_LABELS[key] + ')</span><span class="n">' + g.total + '</span>';
    allItem.onclick = function(){
      state.activeSite = key;
      state.category = 'Все';
      state.favOnly = false;
      render(); updateFavBtn(); updateTopCatSelectValue(); buildDrawer(); buildQuickRow();
      closeQuickPopover();
    };
    pop.appendChild(allItem);

    catNames.forEach(function(catName){
      var item = document.createElement('div');
      var isActive = !state.favOnly && !state.activeSite && state.category === catName;
      item.className = 'quick-popover-item' + (isActive ? ' active' : '');
      item.innerHTML = '<span>' + catName + '</span><span class="n">' + g.cats[catName] + '</span>';
      item.onclick = function(){
        state.category = catName;
        state.activeSite = null;
        state.favOnly = false;
        render(); updateFavBtn(); updateTopCatSelectValue(); buildDrawer(); buildQuickRow();
        closeQuickPopover();
      };
      pop.appendChild(item);
    });

    document.body.appendChild(pop);
    els.quickPopover = pop;

    // Позиционируем ПОД нажатой иконкой (панель теперь в топбаре, наверху
    // экрана), по центру, с защитой от выхода за левый/правый край экрана.
    var rect = anchorBtn.getBoundingClientRect();
    var popRect = pop.getBoundingClientRect();
    var left = rect.left + rect.width / 2 - popRect.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - popRect.width - 8));
    pop.style.left = left + 'px';
    pop.style.top = (rect.bottom + 8) + 'px';
  }

  function buildQuickRow(){
    els.quickRow.innerHTML = '';
    var groups = computeSourceGroups();

    SITE_ORDER.forEach(function(key){
      var g = groups[key];
      if (!g) return;
      var catNames = Object.keys(g.cats).sort();
      var hasSubcategories = catNames.length > 1;
      var isActive = !state.favOnly && (
        state.activeSite === key ||
        (!state.activeSite && catNames.indexOf(state.category) !== -1)
      );

      var btn = document.createElement('button');
      btn.className = 'quick-item' + (isActive ? ' active' : '');
      btn.innerHTML = QUICK_ICONS[key] + '<span>' + QUICK_LABELS[key] + '</span>';
      btn.onclick = function(){
        if (hasSubcategories) {
          if (quickPopoverOpenSite === key) { closeQuickPopover(); return; } // повторный тап — закрыть
          openQuickPopover(key, btn, g, catNames);
          return;
        }
        state.activeSite = key;
        state.category = 'Все';
        state.favOnly = false;
        render();
        updateFavBtn();
        updateTopCatSelectValue();
        buildDrawer();
        buildQuickRow();
      };
      els.quickRow.appendChild(btn);
    });
    // Иконку "Избранное" здесь убрали — она дублировала отдельную кнопку
    // ★ Избранное в топбаре (см. #favBtn), а держать один и тот же переключатель
    // в двух местах панели избыточно.
  }

  // ---- боковая шторка: второй, альтернативный вход в выбор категорий ----
  // Выбор применяется СРАЗУ по тапу — как в исходной версии шторки
  // (index.backup-with-drawer.html), просто теперь она сосуществует с
  // select'ом в топбаре выше, а не заменена им.
  function buildDrawer(){
    var groups = computeSourceGroups();

    els.drawerAll.className = 'drawer-item' + (state.category === 'Все' && !state.favOnly ? ' active' : '');
    els.drawerFav.className = 'drawer-item' + (state.favOnly ? ' active' : '');

    els.drawerGroups.innerHTML = '';

    var label = document.createElement('div');
    label.className = 'drawer-section-label';
    label.textContent = 'Источники';
    els.drawerGroups.appendChild(label);

    SITE_ORDER.forEach(function(key){
      var g = groups[key];
      if (!g) return;
      var meta = SITE_META[key] || { title: key, subtitle: '', color: '#888' };
      var catNames = Object.keys(g.cats).sort();

      // Состояние "развёрнуто/свёрнуто" общее с модалкой (state.expandedGroups) —
      // оба входа показывают один и тот же список источников, логично, чтобы
      // раскрытая группа не "схлопывалась" при переключении между ними.
      if (state.expandedGroups[key] === undefined && !state.favOnly && catNames.indexOf(state.category) !== -1) {
        state.expandedGroups[key] = true;
      }
      var isExpanded = !!state.expandedGroups[key];

      var groupEl = document.createElement('div');
      groupEl.className = 'drawer-group' + (isExpanded ? ' expanded' : '');
      groupEl.setAttribute('data-site', key);

      // Пользователю показываем, ЧТО за материал внутри группы (meta.subtitle,
      // например "Плёнка ПВХ"), а не название сайта-источника (meta.title) —
      // это внутренняя техническая деталь скрапинга, ей тут не место.
      var header = document.createElement('div');
      header.className = 'drawer-group-header';
      header.innerHTML =
        '<div class="drawer-group-badge" style="background:' + meta.color + '">' + meta.subtitle.charAt(0) + '</div>' +
        '<div class="drawer-group-text">' +
          '<div class="drawer-group-title">' + meta.subtitle + '</div>' +
          '<div class="drawer-group-sub">' + g.total + ' материал(ов)</div>' +
        '</div>' +
        '<div class="drawer-group-arrow">▶</div>';
      header.onclick = function(){
        state.expandedGroups[key] = !isExpanded;
        buildDrawer();
      };
      groupEl.appendChild(header);

      var subitemsWrap = document.createElement('div');
      subitemsWrap.className = 'drawer-subitems';
      catNames.forEach(function(catName){
        var sub = document.createElement('div');
        sub.className = 'drawer-subitem' + (state.category === catName && !state.favOnly ? ' active' : '');
        sub.innerHTML = '<span>' + catName + '</span><span class="n">' + g.cats[catName] + '</span>';
        sub.onclick = function(){
          state.category = catName;
          state.activeSite = null;
          state.favOnly = false;
          render();
          updateFavBtn();
          updateTopCatSelectValue();
          buildDrawer();
          buildQuickRow();
          closeDrawer();
        };
        subitemsWrap.appendChild(sub);
      });
      groupEl.appendChild(subitemsWrap);

      els.drawerGroups.appendChild(groupEl);
    });
  }

  function openDrawer(){
    buildDrawer();
    els.drawer.classList.add('open');
    els.drawerOverlay.classList.add('open');
  }
  function closeDrawer(){
    els.drawer.classList.remove('open');
    els.drawerOverlay.classList.remove('open');
  }

  // ---- свайп для закрытия шторки: панель следует за пальцем, на отпускании
  // либо плавно захлопывается обратно, либо доезжает и закрывается ----
  (function initDrawerSwipe(){
    var drag = null;
    var W = 320;
    els.drawer.addEventListener('touchstart', function(e){
      if (!els.drawer.classList.contains('open')) return;
      W = els.drawer.offsetWidth;
      drag = { startX: e.touches[0].clientX, startY: e.touches[0].clientY, dx: 0, locked: null };
      els.drawer.classList.add('dragging');
    }, {passive:true});
    els.drawer.addEventListener('touchmove', function(e){
      if (!drag) return;
      var t = e.touches[0];
      var dx = t.clientX - drag.startX;
      var dy = t.clientY - drag.startY;
      if (drag.locked === null) drag.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.locked !== 'x' || dx > 0) return;
      drag.dx = dx;
      els.drawer.style.transform = 'translateX(' + dx + 'px)';
      els.drawerOverlay.style.opacity = Math.max(0, 1 + dx / W) * 1;
    }, {passive:true});
    els.drawer.addEventListener('touchend', function(){
      if (!drag) return;
      els.drawer.classList.remove('dragging');
      els.drawer.style.transform = '';
      els.drawerOverlay.style.opacity = '';
      if (drag.dx < -W * 0.28) closeDrawer();
      drag = null;
    });
  })();

  els.menuBtn.onclick = openDrawer;
  els.drawerClose.onclick = closeDrawer;
  els.drawerOverlay.onclick = closeDrawer;
  els.drawerAll.onclick = function(){
    state.category = 'Все';
    state.activeSite = null;
    state.favOnly = false;
    render();
    updateFavBtn();
    updateTopCatSelectValue();
    buildDrawer();
    buildQuickRow();
    closeDrawer();
  };
  els.drawerFav.onclick = function(){
    state.favOnly = !state.favOnly;
    render();
    updateFavBtn();
    updateTopCatSelectValue();
    buildDrawer();
    buildQuickRow();
    closeDrawer();
  };

  function matches(item){
    if (state.favOnly && state.favorites.indexOf(item.id) === -1) return false;
    if (!state.favOnly) {
      // activeSite — фильтр по ВСЕМ категориям одного источника разом (см.
      // quick-row), отличается от category — фильтра по ОДНОЙ конкретной
      // категории (drawer/select). Одновременно активен только один из них.
      if (state.activeSite) {
        if (siteGroupOf(item.category) !== state.activeSite) return false;
      } else if (state.category !== 'Все' && item.category !== state.category) {
        return false;
      }
    }
    if (state.query) {
      var q = state.query.toLowerCase();
      if (item.name.toLowerCase().indexOf(q) === -1 && item.id.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  // ---- память прокрутки: у каждого фильтра — своё место, где остановились ----
  // Ключ — РЕЗУЛЬТАТ фильтрации (favOnly/activeSite/category), а не то, каким
  // именно UI его выбрали — поэтому неважно, переключились ли через иконку
  // снизу, шторку или кнопку сверху: список либо продолжается с прежнего
  // места (если этот фильтр уже открывали в этой сессии), либо начинается
  // сначала (если фильтр новый). Поиск (state.query) в ключ намеренно НЕ
  // входит — при вводе/очистке поиска список всегда пролистывается наверх
  // отдельно, в обработчике поля поиска (см. ниже).
  var scrollPositions = {};
  var lastFilterKey = null;

  function filterStateKey(){
    if (state.favOnly) return 'fav';
    if (state.activeSite) return 'site:' + state.activeSite;
    if (state.category === 'Все') return 'all';
    return 'cat:' + state.category;
  }

  // ---- фоновая предзагрузка полноразмерных фото ----
  // Пока пользователь листает сетку карточек (там грузятся только лёгкие
  // превью), в фоне тихо подгружаем полноразмерные фото карточек, которые
  // попали в область видимости — с небольшим запасом (rootMargin), чтобы
  // подгрузка начиналась чуть раньше, чем карточка реально попадёт на экран.
  // К моменту, когда человек нажмёт на фото, оно уже в кэше браузера и
  // просмотрщик открывает его мгновенно — независимо от скорости интернета
  // именно в этот момент. Ограничиваем число одновременных закачек, чтобы
  // не отбирать канал у самих превью в сетке.
  var prefetchedIds = {};
  var prefetchQueue = [];
  var prefetchActive = 0;
  var PREFETCH_CONCURRENCY = 3;

  function pumpPrefetchQueue(){
    while (prefetchActive < PREFETCH_CONCURRENCY && prefetchQueue.length){
      var url = prefetchQueue.shift();
      prefetchActive++;
      var img = new Image();
      var done = function(){ prefetchActive--; pumpPrefetchQueue(); };
      img.onload = done;
      img.onerror = done;
      img.src = url;
    }
  }

  function schedulePrefetch(urls){
    urls.forEach(function(url){ if (url) prefetchQueue.push(url); });
    pumpPrefetchQueue();
  }

  var prefetchObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      prefetchObserver.unobserve(entry.target);
      var id = entry.target.getAttribute('data-prefetch-id');
      if (!id || prefetchedIds[id]) return;
      prefetchedIds[id] = true;
      schedulePrefetch(entry.target.__prefetchUrls || []);
    });
  }, { rootMargin: '400px 0px' }) : null;

  // Пока каталог не загружен, показываем "дышащие" плейсхолдеры карточек —
  // это выглядит опрятнее пустого экрана и снижает ощущение подвисания.
  function renderSkeleton(){
    els.grid.innerHTML = '';
    els.empty.style.display = 'none';
    els.count.textContent = 'Загрузка каталога…';
    for (var i = 0; i < 8; i++) {
      var sk = document.createElement('div');
      sk.className = 'skeleton skeleton-card';
      els.grid.appendChild(sk);
    }
  }

  // Высота топбара может немного плавать (перенос строки поиска, длинное
  // название активной категории в чипсах) — поэтому меряем реально, а не
  // подставляем число руками, и держим это значение свежим через ResizeObserver.
  function updateTopbarHeight(){
    if (!els.topbar) return;
    document.documentElement.style.setProperty('--topbar-h', els.topbar.offsetHeight + 'px');
  }
  if (els.topbar && 'ResizeObserver' in window) {
    new ResizeObserver(updateTopbarHeight).observe(els.topbar);
  } else {
    window.addEventListener('resize', updateTopbarHeight);
  }
  updateTopbarHeight();

  // Скрытие/появление шапки при скролле контента: подтверждено записями
  // экрана, что механизм работает (scroll/touch-события доходят, apply()
  // срабатывает, CSS корректно показывает/прячет шапку) — отладочный
  // счётчик на экране (#debugChrome) своё дело сделал, убран.
  (function initScrollChrome(){
    var lastY = window.scrollY || 0;
    var THRESHOLD_HIDE = 6;
    var root = document.documentElement;

    function apply(down){
      root.classList.toggle('chrome-hidden', down);
      if (down) {
        closeTopCatPopover();
        closeQuickPopover();
      }
    }

    function currentY(){
      return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function update(){
      var y = currentY();
      var diff = y - lastY;
      if (y <= 10) {
        apply(false);
      } else if (diff < 0) {
        apply(false);
      } else if (diff > THRESHOLD_HIDE) {
        apply(true);
      } else {
        return;
      }
      lastY = y;
    }

    window.addEventListener('scroll', update, {passive:true});
    document.addEventListener('scroll', update, {passive:true});

    var touchY = null;
    window.addEventListener('touchstart', function(e){
      touchY = (e.touches && e.touches[0]) ? e.touches[0].clientY : null;
    }, {passive:true});
    window.addEventListener('touchmove', function(e){
      if (touchY != null && e.touches && e.touches[0]) {
        var y = e.touches[0].clientY;
        if (y - touchY > 4) apply(false);
        touchY = y;
      }
    }, {passive:true});
    window.addEventListener('touchend', function(){
      touchY = null;
    }, {passive:true});
  })();

  function render(){
    // Смена фильтра (см. filterStateKey) — запоминаем, докуда долистали
    // ПРЕЖНИЙ фильтр (пока страница ещё не перестроена), а после отрисовки
    // новой ленты — восстанавливаем сохранённую позицию нового фильтра (0,
    // если этот фильтр открывают впервые в этой сессии). Если фильтр не
    // менялся (например render() вызван из-за тапа по сердечку или ввода в
    // поиск) — прокрутку не трогаем вовсе, оставляем как есть.
    var newFilterKey = filterStateKey();
    var filterChanged = lastFilterKey !== null && newFilterKey !== lastFilterKey;
    if (filterChanged) {
      scrollPositions[lastFilterKey] = window.scrollY;
    }

    var filtered = state.items.filter(matches);
    els.count.textContent = filtered.length + ' материал(ов)';
    els.grid.innerHTML = '';
    els.empty.style.display = filtered.length ? 'none' : 'block';

    // Заголовки-разделители категорий имеют смысл только когда лента реально
    // смешанная (весь каталог или избранное) — если выбрана одна конкретная
    // категория, все карточки и так из неё одной, заголовок был бы лишним.
    var showSectionHeaders = state.favOnly || state.category === 'Все';
    var lastCategory = null;

    filtered.forEach(function(item, idx){
      if (showSectionHeaders && item.category !== lastCategory) {
        lastCategory = item.category;
        var headerEl = document.createElement('div');
        headerEl.className = 'section-header';
        headerEl.textContent = item.category;
        els.grid.appendChild(headerEl);
      }

      var site = siteGroupOf(item.category);
      var siteColor = (SITE_META[site] || {}).color || 'transparent';

      var card = document.createElement('div');
      card.className = 'card appear';
      card.setAttribute('data-site', site);
      // лёгкий "каскадный" эффект появления, без задержки для длинных списков
      card.style.animationDelay = Math.min(idx * 12, 240) + 'ms';

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      // Для карточки в сетке используем маленькое превью (item.thumb, ~400px),
      // а не полноразмерное фото — так грузится в разы быстрее и легче.
      // Фолбэки нужны для товаров, у которых materials.json ещё старого
      // формата (без поля thumb) — тогда используем то, что есть.
      var thumbSrc = item.thumb || (Array.isArray(item.images) && item.images[0]) || item.image;
      if (thumbSrc) {
        thumbWrap.classList.add('skeleton');
        var img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = item.name;
        img.onload = function(){ img.classList.add('loaded'); thumbWrap.classList.remove('skeleton'); };
        img.onerror = function(){
          console.error('[catalog] не удалось загрузить фото карточки:', thumbSrc, 'товар:', item.id);
          thumbWrap.classList.remove('skeleton');
          img.remove();
          var brokenEl = document.createElement('div');
          brokenEl.className = 'noimg';
          brokenEl.textContent = 'Фото недоступно';
          thumbWrap.insertBefore(brokenEl, thumbWrap.firstChild);
        };
        img.src = thumbSrc;
        thumbWrap.appendChild(img);
      } else {
        var noimg = document.createElement('div');
        noimg.className = 'noimg';
        noimg.textContent = item.name;
        thumbWrap.appendChild(noimg);
      }
      // Ставим карточку под наблюдение для фоновой предзагрузки полного
      // размера (первые 2 фото товара — этого достаточно для мгновенного
      // открытия основного вида, остальные слайды подгрузятся по свайпу).
      if (prefetchObserver) {
        var fullUrls = Array.isArray(item.images) && item.images.length
          ? item.images.slice(0, 2)
          : (item.image ? [item.image] : []);
        thumbWrap.setAttribute('data-prefetch-id', item.id);
        thumbWrap.__prefetchUrls = fullUrls;
        prefetchObserver.observe(thumbWrap);
      }

      // Передаём весь отфильтрованный список и позицию в нём — просмотрщик
      // использует это для вертикального свайпа между материалами, в том же
      // порядке, в котором они сейчас идут в сетке.
      thumbWrap.onclick = function(){ openViewer(filtered, idx); };

      var heart = document.createElement('div');
      heart.className = 'heart' + (state.favorites.indexOf(item.id) >= 0 ? ' active' : '');
      heart.textContent = state.favorites.indexOf(item.id) >= 0 ? '♥' : '♡';
      heart.onclick = function(e){ e.stopPropagation(); toggleFavorite(item.id); };
      thumbWrap.appendChild(heart);

      // Копирование названия — маленькая иконка поверх фото (под сердечком),
      // а не отдельная полноширинная кнопка под каждой из 574 карточек.
      var copyIconBtn = document.createElement('div');
      copyIconBtn.className = 'copy-icon-btn';
      copyIconBtn.title = 'Скопировать название';
      copyIconBtn.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="9" y="9" width="12" height="12" rx="2"></rect>' +
        '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
        '</svg>';
      copyIconBtn.onclick = function(e){ e.stopPropagation(); copyText(item.name); };
      thumbWrap.appendChild(copyIconBtn);

      var info = document.createElement('div');
      info.className = 'info';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;
      var cat = document.createElement('div');
      cat.className = 'cat';
      var dot = document.createElement('span');
      dot.className = 'source-dot';
      dot.style.background = siteColor;
      cat.appendChild(dot);
      cat.appendChild(document.createTextNode(item.category));

      info.appendChild(name);
      info.appendChild(cat);

      card.appendChild(thumbWrap);
      card.appendChild(info);
      els.grid.appendChild(card);
    });

    if (filterChanged) {
      // Лента уже перестроена — теперь можно безопасно прокрутить к
      // сохранённой позиции (или к 0, если этот фильтр открыт впервые).
      window.scrollTo(0, scrollPositions[newFilterKey] || 0);
    }
    lastFilterKey = newFilterKey;
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
        try {
          if (tg && tg.showPopup && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
            tg.showPopup({ message: 'Скопировано: ' + text });
          } else {
            alert('Скопировано: ' + text);
          }
        } catch(e){ alert('Скопировано: ' + text); }
      });
    }
  }

  // ---- просмотрщик фото: живая drag-карусель вместо мгновенной смены src ----
  // Все фото товара рендерятся в один горизонтальный "трек"; во время свайпа
  // трек следует за пальцем без задержки, на отпускании — плавно доезжает
  // до соседнего кадра или пружинисто возвращается назад (rubber-band на краях).
  // viewerState.list/itemIdx — текущий отфильтрованный список материалов и
  // позиция в нём (для вертикального свайпа между материалами, см. ниже).
  // images/idx — фото ТЕКУЩЕГО материала и позиция в нём (горизонтальный свайп).
  var viewerState = { list: [], itemIdx: 0, images: [], idx: 0, currentItem: null };

  // Иконка ♡ во вьювере — та же логика избранного, что и на карточке
  // (state.favorites), просто отрисованная поверх полноэкранного фото.
  function updateViewerHeart(){
    var item = viewerState.currentItem;
    if (!item || !els.vheart) return;
    var isFav = state.favorites.indexOf(item.id) >= 0;
    els.vheart.className = 'vheart' + (isFav ? ' active' : '');
    els.vheart.textContent = isFav ? '♥' : '♡';
  }

  // ---- зум текущего фото во вьювере: пинч двумя пальцами + дабл-тап ----
  // Зум применяется трансформом прямо на .vfull текущего слайда, независимо
  // от translateX трека (тот двигает слайды между собой, этот — масштабирует
  // и панорамирует содержимое одного слайда). Сбрасывается при смене фото
  // (goToImage) и при открытии нового материала (renderViewerItem).
  var ZOOM_MIN = 1, ZOOM_MAX = 4, DOUBLE_TAP_SCALE = 2.5;
  var zoom = { scale: 1, x: 0, y: 0 };

  function getCurrentSlideImg(){
    var slide = els.vtrack.children[viewerState.idx];
    return slide ? slide.querySelector('.vfull') : null;
  }

  function clampPan(){
    var rect = els.vswipe.getBoundingClientRect();
    var maxX = (rect.width * (zoom.scale - 1)) / 2;
    var maxY = (rect.height * (zoom.scale - 1)) / 2;
    zoom.x = Math.max(-maxX, Math.min(maxX, zoom.x));
    zoom.y = Math.max(-maxY, Math.min(maxY, zoom.y));
  }

  function applyZoom(animate){
    var img = getCurrentSlideImg();
    if (!img) return;
    img.style.transition = animate ? 'transform .2s ease' : 'none';
    img.style.transform = 'translate(' + zoom.x + 'px,' + zoom.y + 'px) scale(' + zoom.scale + ')';
    // Пока фото увеличено — одиночный палец панорамирует картинку вместо
    // обычного свайпа между фото/материалами (см. initViewerGestures).
    els.vitem.classList.toggle('zoomed', zoom.scale > 1);
  }

  function resetZoom(animate){
    zoom.scale = 1; zoom.x = 0; zoom.y = 0;
    applyZoom(animate);
  }

  function setTrackTransform(px, animate){
    els.vtrack.style.transition = animate ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
    els.vtrack.style.transform = 'translateX(calc(' + (-viewerState.idx * 100) + '% + ' + px + 'px))';
  }

  function updateViewerChrome(){
    var imgs = viewerState.images, idx = viewerState.idx;
    els.vdots.innerHTML = '';
    if (imgs.length > 1){
      imgs.forEach(function(_, i){
        var dot = document.createElement('div');
        dot.className = 'vdot' + (i === idx ? ' active' : '');
        els.vdots.appendChild(dot);
      });
    }
    els.vprev.className = 'vnavbtn' + (idx === 0 ? ' hidden' : '');
    els.vnext.className = 'vnavbtn' + (idx >= imgs.length - 1 ? ' hidden' : '');
  }

  function goToImage(newIdx, animate){
    viewerState.idx = Math.max(0, Math.min(newIdx, viewerState.images.length - 1));
    setTrackTransform(0, animate !== false);
    updateViewerChrome();
    resetZoom(false); // новое фото всегда открывается без зума с прошлого
  }

  // Строит слайды (фото + blur-up превью) для ОДНОГО материала — используется
  // и при первом открытии просмотрщика, и при переходе на соседний материал
  // вертикальным свайпом (тогда просто пересобираем содержимое на месте).
  function renderViewerItem(item){
    var imgs = Array.isArray(item.images) && item.images.length ? item.images : (item.image ? [item.image] : []);
    var thumbs = Array.isArray(item.thumbs) && item.thumbs.length ? item.thumbs : (item.thumb ? [item.thumb] : []);
    viewerState.images = imgs;
    viewerState.idx = 0;
    viewerState.currentItem = item;
    console.log('[catalog] открыт просмотрщик:', item.id, '— фото:', imgs.length);

    els.vtrack.innerHTML = '';
    imgs.forEach(function(src, i){
      var slide = document.createElement('div');
      slide.className = 'vslide';

      // blur-up: своё маленькое превью на этот слайд (обычно уже в кэше
      // браузера — либо с сетки карточек, либо благодаря фоновой
      // предзагрузке, см. schedulePrefetch) показываем сразу и размытым,
      // пока рядом тихо грузится полный размер.
      var thumbSrc = thumbs[i];
      if (thumbSrc && thumbSrc !== src) {
        var thumbImg = document.createElement('img');
        thumbImg.className = 'vthumb';
        thumbImg.alt = '';
        thumbImg.draggable = false;
        thumbImg.src = thumbSrc;
        slide.appendChild(thumbImg);
      }

      var fullImg = document.createElement('img');
      fullImg.className = 'vfull';
      fullImg.alt = item.name;
      fullImg.draggable = false;
      fullImg.onload = function(){ fullImg.classList.add('loaded'); };
      fullImg.onerror = function(){
        console.error('[catalog] не удалось загрузить фото во вьювере:', src, 'товар:', item.id);
        slide.innerHTML =
          '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
          'color:#bbb;font-size:13px;">Фото недоступно</div>';
      };
      fullImg.src = src;
      slide.appendChild(fullImg);

      els.vtrack.appendChild(slide);
    });
    setTrackTransform(0, false);
    updateViewerChrome();
    zoom.scale = 1; zoom.x = 0; zoom.y = 0; // без applyZoom — слайды только что пересозданы

    els.vname.textContent = item.name;
    els.vcat.textContent = item.category;
    els.vcopy.onclick = function(){ copyText(item.name); };
    updateViewerHeart();
    els.vheart.onclick = function(){ toggleFavorite(item.id); };
  }

  // list — та же отфильтрованная лента, что сейчас отрендерена в сетке (см.
  // вызов openViewer(filtered, idx) в render()); idx — индекс материала,
  // по фото которого тапнули. Так вертикальный свайп двигается ровно по
  // тому же порядку, в котором человек листал сетку.
  function openViewer(list, idx){
    viewerState.list = list;
    viewerState.itemIdx = idx;
    els.vitem.style.transition = 'none';
    els.vitem.style.transform = 'translateY(0)';
    renderViewerItem(list[idx]);
    els.viewer.classList.add('open');
  }

  function snapItemBack(){
    els.vitem.style.transition = 'transform .25s ease';
    els.vitem.style.transform = 'translateY(0)';
  }

  // Переход к следующему/предыдущему материалу БЕЗ выхода из просмотрщика:
  // текущее содержимое уезжает по вертикали за экран, затем на его место
  // подставляется соседний материал — не нужно закрывать/открывать вьювер
  // заново, чтобы посмотреть следующий.
  function goToVerticalItem(direction){
    var newIdx = viewerState.itemIdx + direction;
    if (newIdx < 0 || newIdx >= viewerState.list.length) { snapItemBack(); return; }
    var vitem = els.vitem;
    vitem.style.transition = 'transform .25s ease';
    vitem.style.transform = 'translateY(' + (direction > 0 ? '-100%' : '100%') + ')';
    var onDone = function(){
      vitem.removeEventListener('transitionend', onDone);
      viewerState.itemIdx = newIdx;
      renderViewerItem(viewerState.list[newIdx]);
      vitem.style.transition = 'none';
      vitem.style.transform = 'translateY(0)';
    };
    vitem.addEventListener('transitionend', onDone);
  }

  els.vprev.onclick = function(e){ e.stopPropagation(); goToImage(viewerState.idx - 1); };
  els.vnext.onclick = function(e){ e.stopPropagation(); goToImage(viewerState.idx + 1); };

  // Один обработчик на несколько независимых жестов:
  // - одним пальцем при zoom.scale===1: горизонтальный свайп листает фото
  //   текущего материала, вертикальный — переключает сам материал (как раньше);
  // - одним пальцем при zoom.scale>1: панорамирование увеличенного фото
  //   (свайп/переключение материала в этот момент отключены);
  // - двумя пальцами: пинч-зум;
  // - двойной тап: приблизить до DOUBLE_TAP_SCALE / вернуть к 1x.
  // Ось обычного свайпа определяется один раз за жест по первому заметному
  // движению и дальше не меняется — эта часть логики не тронута.
  (function initViewerGestures(){
    var drag = null;
    var pinch = null;
    var pan = null;
    var lastTap = { time: 0, x: 0, y: 0 };

    function touchDist(t0, t1){
      var dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function zoomAtPoint(clientX, clientY, targetScale){
      var rect = els.vswipe.getBoundingClientRect();
      var offsetX = clientX - rect.left - rect.width / 2;
      var offsetY = clientY - rect.top - rect.height / 2;
      // Пересчитываем панорамирование так, чтобы точка под пальцем/тапом
      // осталась на месте при изменении масштаба.
      var factor = targetScale / zoom.scale;
      zoom.x = (zoom.x - offsetX) * factor + offsetX;
      zoom.y = (zoom.y - offsetY) * factor + offsetY;
      zoom.scale = targetScale;
      clampPan();
    }

    els.vitem.addEventListener('touchstart', function(e){
      if (e.touches.length === 2) {
        drag = null; pan = null;
        pinch = {
          startDist: touchDist(e.touches[0], e.touches[1]) || 1,
          startScale: zoom.scale
        };
        return;
      }
      pinch = null;
      var t = e.touches[0];
      if (zoom.scale > 1) {
        pan = { startX: t.clientX, startY: t.clientY, origX: zoom.x, origY: zoom.y };
        drag = null;
      } else {
        pan = null;
        drag = { startX: t.clientX, startY: t.clientY, dx: 0, dy: 0, locked: null };
      }
    }, {passive:true});

    els.vitem.addEventListener('touchmove', function(e){
      if (pinch && e.touches.length === 2) {
        var dist = touchDist(e.touches[0], e.touches[1]) || 1;
        var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        var targetScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinch.startScale * (dist / pinch.startDist)));
        zoomAtPoint(midX, midY, targetScale);
        applyZoom(false);
        return;
      }
      if (pan) {
        var t = e.touches[0];
        zoom.x = pan.origX + (t.clientX - pan.startX);
        zoom.y = pan.origY + (t.clientY - pan.startY);
        clampPan();
        applyZoom(false);
        return;
      }
      if (!drag) return;
      var t2 = e.touches[0];
      var dx = t2.clientX - drag.startX;
      var dy = t2.clientY - drag.startY;
      if (drag.locked === null) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        drag.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if (drag.locked === 'x') {
        if (viewerState.images.length < 2) return;
        var atStart = viewerState.idx === 0 && dx > 0;
        var atEnd = viewerState.idx === viewerState.images.length - 1 && dx < 0;
        drag.dx = (atStart || atEnd) ? dx * 0.35 : dx;
        setTrackTransform(drag.dx, false);
      } else {
        var atFirst = viewerState.itemIdx === 0 && dy > 0;
        var atLast = viewerState.itemIdx === viewerState.list.length - 1 && dy < 0;
        drag.dy = (atFirst || atLast) ? dy * 0.35 : dy;
        els.vitem.style.transition = 'none';
        els.vitem.style.transform = 'translateY(' + drag.dy + 'px)';
      }
    }, {passive:true});

    els.vitem.addEventListener('touchend', function(e){
      if (pinch) {
        // Обе точки контакта подняты (или осталась одна) — фиксируем зум как есть.
        if (e.touches.length < 2) pinch = null;
        return;
      }
      if (pan) {
        pan = null;
        return;
      }
      if (!drag) return;

      // Тап без заметного движения — кандидат на двойной тап (зум).
      if (drag.locked === null) {
        var now = Date.now();
        var tapX = drag.startX, tapY = drag.startY;
        var isDouble = (now - lastTap.time) < 300 &&
          Math.abs(tapX - lastTap.x) < 30 && Math.abs(tapY - lastTap.y) < 30;
        if (isDouble) {
          if (zoom.scale > 1) {
            resetZoom(true);
          } else {
            zoomAtPoint(tapX, tapY, DOUBLE_TAP_SCALE);
            applyZoom(true);
          }
          lastTap.time = 0;
        } else {
          lastTap = { time: now, x: tapX, y: tapY };
        }
        drag = null;
        return;
      }

      if (drag.locked === 'x') {
        var w = els.vswipe.clientWidth || 300;
        if (drag.dx <= -w * 0.18) goToImage(viewerState.idx + 1);
        else if (drag.dx >= w * 0.18) goToImage(viewerState.idx - 1);
        else goToImage(viewerState.idx);
      } else if (drag.locked === 'y') {
        var h = els.vitem.clientHeight || 500;
        if (drag.dy <= -h * 0.16) goToVerticalItem(1);
        else if (drag.dy >= h * 0.16) goToVerticalItem(-1);
        else snapItemBack();
      }
      drag = null;
    });
  })();

  els.vclose.onclick = function(){ els.viewer.classList.remove('open'); };

  var searchTimer;
  els.search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var val = els.search.value;
    searchTimer = setTimeout(function(){
      state.query = val;
      render();
      // Поиск не участвует в памяти прокрутки фильтров (filterStateKey
      // намеренно её игнорирует) — при вводе/очистке текста результаты
      // всегда показываются с самого начала списка.
      window.scrollTo(0, 0);
    }, 150);
  });

  // ---- стартовый экран (splash) ----
  // Показывается только при первом запуске приложения. localStorage уже
  // проверен синхронно в самом начале body (чтобы не мигало), здесь —
  // авторитетная проверка через CloudStorage (та же схема, что и у
  // избранного) плюс сама логика закрытия по тапу на "Каталог".
  function initSplash(){
    var splashEl = document.getElementById('splash');
    var ctaEl = document.getElementById('splashCta');
    if (!splashEl) return;

    function hideSplash(animate){
      if (splashEl.style.display === 'none') return;
      if (animate) {
        splashEl.classList.add('fade-out');
        setTimeout(function(){ splashEl.style.display = 'none'; }, 350);
      } else {
        splashEl.style.display = 'none';
      }
    }

    function markSplashSeen(){
      try { localStorage.setItem('splash_seen', '1'); } catch(e){}
      if (cloudStorageAvailable()) {
        try { tg.CloudStorage.setItem('splash_seen', '1', function(){}); } catch(e){}
      }
    }

    // Если сплэш уже видели на другом устройстве (CloudStorage) — закрываем
    // без анимации, даже если локально на этом устройстве флага ещё не было.
    if (cloudStorageAvailable()) {
      try {
        tg.CloudStorage.getItem('splash_seen', function(err, value){
          if (!err && value === '1') hideSplash(false);
        });
      } catch(e){}
    }

    if (ctaEl) {
      ctaEl.onclick = function(){
        markSplashSeen();
        hideSplash(true);
      };
    }
  }

  renderSkeleton();
  loadFavorites(loadCatalog);
  initSplash();
})();
</script>
</body>
</html>
