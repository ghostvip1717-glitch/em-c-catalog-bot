<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Каталог материалов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Фиксированная фирменная палитра (та же, что на стартовом экране) — по
     согласованию каталог не подстраивается под тему Telegram (--tg-theme-*).
     Светло-серая тема: светло-серый фон, белые поверхности карточек/полей,
     тёмный текст; тёплый золотой акцент — как и раньше — для кнопок и
     выделений (единственная сохранённая деталь прежней тёмной палитры). */
  :root{
    /* Палитра "Cloud Dancer" — светлый премиум: мягкий тёплый беж вместо
       белого/серого фона (по мотивам Pantone Cloud Dancer, цвет 2026 года),
       карточки — чистый белый, акцент — терракота. Светлая тема, поэтому
       --hint читается прямо на фоне без отдельного "сильного" варианта —
       но --hint-strong оставлен (используется в паре мест) с ещё большим
       запасом контраста. Все пары пересчитаны на реальный контраст (WCAG). */
    --bg: #EDE8E0;
    --text: #2B2620;
    --hint: #7D7263;
    --hint-strong: #55493C;
    /* Терракота потемнее, чем в макете-превью (#C1622D), ради контраста: на
       белых карточках (--secbg) даёт ~5.6:1, на панели быстрых иконок —
       ~3.8:1 (обе пары уверенно проходят WCAG AA для соответствующего
       размера текста). */
    --link: #A84E1A;
    --button: #A84E1A;
    --button-text: #ffffff;
    --secbg: #FFFFFF;
    --line: #DED4C4;
    /* Ниже — переменные, которые раньше были захардкожены прямо в правилах
       (панель быстрых иконок, матовая полоска над шапкой, подложка сплэш-
       экрана). Вынесены в :root, чтобы тему можно было целиком переключать
       через applyTheme() в скрипте, не трогая CSS-правила. RGB-варианты
       (без единиц) — специально для составления rgba(var(...), альфа). */
    --quickrow-bg: #DDD5C8;
    --safetop-tint-rgb: 237,232,224;
    --splash-tint-rgb: 255,255,255;
    /* В fullscreen-режиме Telegram рисует СВОИ элементы (кнопка "Закрыть"
       слева, стрелка/меню справа) поверх верхней части экрана — это не часть
       нашего DOM, а собственный оверлей клиента Telegram, поэтому его нельзя
       просто "подвинуть" стилями. Вместо этого мы читаем зарезервированную
       под него высоту через Telegram.WebApp.contentSafeAreaInset (см.
       applySafeArea() в скрипте, там же +буфер про запас) и подставляем
       сюда — весь наш верхний блок сдвигается ниже этой полосы целиком.
       Значение приходит от самого Telegram под конкретное устройство/версию
       клиента — не захардкожено, поэтому корректно у любого пользователя.
       По умолчанию (вне fullscreen/вне Telegram) — 0px, ничего не сдвигается. */
    --content-safe-top: 0px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  /* Топбар прячется/появляется при скролле через position:fixed + transform
     (JS слушает scroll и touchmove — см. initScrollChrome в скрипте).
     Подтверждено записями экрана: механизм работает надёжно. */
  #app{
    padding:8px 10px 24px;
    padding-top:calc(8px + var(--content-safe-top, 0px) + var(--topbar-h, 180px));
    transform:translateY(0);
    transition:transform .25s ease;
  }
  html.chrome-hidden #app{
    transform:translateY(calc(-1 * var(--topbar-h, 180px)));
  }

  .topbar{
    position:fixed;left:0;right:0;top:var(--content-safe-top, 0px);background:var(--bg);padding:6px 0 8px;
    z-index:5;border-bottom:1px solid var(--line);
    transform:translateY(0);
    transition:transform .25s ease;
  }
  html.chrome-hidden .topbar{
    transform:translateY(-130%);
  }

  /* Полоска НАД топбаром высотой ровно в --content-safe-top — там, где
     Telegram в fullscreen рисует свои кнопки (Закрыть/шеврон) поверх нашего
     контента. Раньше там просто просвечивала лента карточек как есть
     (резко, без обработки) — теперь матовое стекло: контент под ней виден,
     но размыт, как в системных полупрозрачных панелях iOS/Android. Если
     content-safe-top равен 0 (не fullscreen/не Telegram) — высота 0,
     полоски не видно, ничего лишнего не рисуется. pointer-events:none —
     чтобы не мешать тапам по кнопкам Telegram над ней.
     Уезжает вместе с топбаром при скролле вниз (тот же transform и та же
     длительность анимации — см. .topbar/html.chrome-hidden .topbar) —
     единое целое, а не отдельный кусок, зависающий сам по себе. */
  .safe-top-blur{
    position:fixed;top:0;left:0;right:0;height:var(--content-safe-top, 0px);
    z-index:6;pointer-events:none;
    background:rgba(var(--safetop-tint-rgb, 237,232,224),.55);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    transform:translateY(0);
    transition:transform .25s ease;
  }
  html.chrome-hidden .safe-top-blur{
    transform:translateY(-100%);
  }

  .search{
    width:100%;padding:10px 12px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:15px;outline:none;
  }
  .search::placeholder{color:var(--hint);}

  .topbar-row{display:flex;gap:8px;align-items:center;}
  .search{flex:1;}
  .fav-btn{
    flex:0 0 auto;height:40px;padding:0 14px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background-color .15s ease,color .15s ease;
  }
  .fav-btn.active{background:#e0245e;color:#fff;}

  /* Кнопка-гамбургер — второй, альтернативный способ открыть категории (см.
     .drawer ниже): боковая шторка вместо fullscreen-модалки. Оба входа ведут
     к одному и тому же состоянию (state.category/state.favOnly). */
  .menu-btn{
    flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* Компактный выбор категории прямо в топбаре — второй, отдельный от
     боковой шторки способ выбрать категорию (третьей строкой под поиском).
     Оба ведут к одному и тому же state.category/state.favOnly — временно
     держим оба варианта одновременно, чтобы сравнить удобство, и позже
     оставить только один. Раньше здесь был нативный <select> — но его
     открытый список рисует ОС/браузер, а не наш CSS, поэтому выглядел
     тёмным и чужеродным на светлой теме; заменили на кнопку + свой popover
     (.top-cat-popover ниже), полностью в стиле приложения. */
  .top-cat-btn{
    width:100%;margin-top:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--secbg);color:var(--text);font-size:13px;font-family:inherit;
    display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;
  }
  .top-cat-btn-arrow{color:var(--hint);font-size:11px;}
  .top-cat-popover{
    position:fixed;z-index:25;background:var(--secbg);border:1px solid var(--line);
    border-radius:12px;padding:6px;max-height:60vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  /* Третий, отдельный от select'а и шторки вход в тот же фильтр — панель
     иконок-ярлыков ПРЯМО В ТОПБАРЕ, под кнопкой категории (по образцу похожих
     рядов быстрого доступа в других каталог-приложениях, но со своими
     словами/иконками, без "поиска на стороннем сайте" и без копирования
     чужих подписей). Едет вместе со всем топбаром как единое целое (топбар —
     один sticky-блок целиком), поэтому здесь уже не нужна собственная
     max-height-анимация — просто статичный ряд внутри топбара. */
  .quick-row{
    display:flex;margin-top:8px;border-radius:10px;
    /* Значение зависит от темы (--quickrow-bg, см. applyTheme в скрипте) —
       в тёмных темах панель светлее фона, в светлых — темнее, иначе
       потеряется на нём. */
    background:var(--quickrow-bg, #DDD5C8);
    padding:8px 4px;
  }
  .quick-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
    background:none;border:none;font-family:inherit;color:var(--text);
    padding:4px 2px;cursor:pointer;
  }
  .quick-item svg{width:24px;height:24px;}
  .quick-item span{font-size:11px;font-weight:500;}
  .quick-item.active{color:var(--button);}

  /* Всплывающее мини-меню категорий одного источника — открывается тапом по
     иконке, у которой внутри больше одной категории (см. openQuickPopover).
     Позиционируется в скрипте прямо над нажатой иконкой. Прозрачный
     backdrop за карточкой нужен только чтобы поймать тап "мимо" и закрыть. */
  .quick-popover-backdrop{position:fixed;inset:0;z-index:24;background:transparent;}
  .quick-popover{
    position:fixed;z-index:25;background:var(--secbg);border:1px solid var(--line);
    border-radius:12px;padding:6px;min-width:180px;max-width:78vw;
    max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .quick-popover-item{
    padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;
    display:flex;justify-content:space-between;gap:8px;
  }
  .quick-popover-item:active{background:rgba(0,0,0,0.05);}
  .quick-popover-item.active{color:var(--button);font-weight:700;}
  .quick-popover-item .n{color:var(--hint);font-size:11px;flex:0 0 auto;}

  .drawer-item{
    padding:12px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:600;
    margin-bottom:4px;transition:background-color .15s ease,color .15s ease;
  }
  .drawer-item.active{background:var(--button);color:var(--button-text);}

  .drawer-section-label{
    font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--hint-strong);text-transform:uppercase;
    margin:18px 4px 8px;
  }

  /* Карточка темы в переключателе — квадратик-превью (фон + акцент одним
     кружком поверх) плюс название, тем же паттерном, что и drawer-group. */
  .theme-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
    background:var(--secbg);margin-bottom:8px;cursor:pointer;
    border:2px solid transparent;
  }
  .theme-item.active{border-color:var(--button);}
  .theme-swatch{
    width:36px;height:36px;border-radius:10px;flex:0 0 auto;position:relative;
    border:1px solid rgba(0,0,0,.08);overflow:hidden;
  }
  .theme-swatch .tsw-accent{
    position:absolute;right:2px;bottom:2px;width:15px;height:15px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.85);
  }
  .theme-name{font-weight:600;font-size:13.5px;color:var(--text);}
  .theme-check{margin-left:auto;color:var(--button);font-weight:700;font-size:15px;flex:0 0 auto;}

  .drawer-group{margin-bottom:8px;border-radius:12px;background:var(--secbg);overflow:hidden;}
  .drawer-group-header{
    display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;
    cursor:pointer;transition:background-color .15s ease;
  }
  .drawer-group-badge{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.2px;
  }
  .drawer-group-text{flex:1;min-width:0;}
  .drawer-group-title{font-weight:700;font-size:13.5px;}
  .drawer-group-sub{font-weight:400;font-size:11.5px;color:var(--hint);margin-top:1px;}
  .drawer-group-arrow{transition:transform .25s ease;color:var(--hint);font-size:12px;flex:0 0 auto;}
  .drawer-group.expanded .drawer-group-arrow{transform:rotate(90deg);}
  .drawer-subitems{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .drawer-group.expanded .drawer-subitems{max-height:700px;}
  .drawer-subitem{
    display:flex;justify-content:space-between;gap:8px;padding:9px 12px 9px 54px;
    font-size:13px;color:var(--text);cursor:pointer;transition:background-color .12s ease;
  }
  .drawer-subitem:active{background:rgba(0,0,0,0.05);}
  .drawer-subitem.active{color:var(--button);font-weight:700;}
  .drawer-subitem .n{color:var(--hint);font-size:11px;flex:0 0 auto;}

  /* Боковая шторка — открывается кнопкой-гамбургером (.menu-btn), выбор
     категории/источника применяется СРАЗУ по тапу (без черновика и кнопки
     "Показать материалы", в отличие от fullscreen-модалки катFloatBtn). */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:86%;max-width:330px;background:var(--bg);
    z-index:61;transform:translateX(-102%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 24px;
    border-right:1px solid var(--line);
  }
  .drawer.open{transform:translateX(0);}
  .drawer.dragging{transition:none;}
  .drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .drawer-title{font-size:17px;font-weight:700;letter-spacing:.1px;}
  .drawer-close{
    width:32px;height:32px;border-radius:50%;background:var(--secbg);display:flex;
    align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex:0 0 auto;
    transition:background-color .15s ease,transform .15s ease;
  }
  .drawer-close:active{transform:scale(0.9);}

  .count{color:var(--hint-strong);font-size:12px;margin:8px 2px 4px;}

  /* align-items:start — карточки НЕ растягиваются под высоту самой высокой
     соседки в ряду. Фото теперь фиксированного 3:4 соотношения (см. .card
     .thumb-wrap ниже), но подпись под ним может занимать разную высоту
     (1 или 2 строки названия) — без start второй ряд карточек съезжал бы. */
  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;
    align-items:start;
  }
  @media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr);}}

  /* Ориентир в общем списке из 500+ позиций: заголовок категории "прилипает"
     под топбаром при прокрутке, пока в поле зрения карточки этой категории.
     top ПОСТОЯННЫЙ (не зависит от chrome-hidden) — двигать его ещё и через
     top при скрытой шапке НЕЛЬЗЯ: он и так уже едет вместе с #app (см. #app
     выше, transform при chrome-hidden) — если вдобавок менять ему top,
     получается двойной сдвиг, и ярлык уезжает не туда (повисает где-то
     посреди экрана, а не у самого верха). Поэтому при скрытой шапке просто
     прячем его прозрачностью — position не трогаем вообще. */
  .section-header{
    grid-column:1/-1;position:sticky;
    top:calc(var(--content-safe-top, 0px) + var(--topbar-h, 0px));
    z-index:3;background:var(--bg);
    padding:12px 2px 7px;font-size:13px;font-weight:700;color:var(--text);
    border-bottom:1px solid var(--line);
    opacity:1;transition:opacity .2s ease;
  }
  html.chrome-hidden .section-header{
    opacity:0;pointer-events:none;
  }
  .section-header:first-of-type{padding-top:2px;}

  .card{
    background:var(--secbg);border-radius:14px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;
    transition:transform .12s ease;
    scroll-margin-top:calc(var(--content-safe-top, 0px) + var(--topbar-h, 0px));
  }
  .card:active{transform:scale(0.97);}
  .card.appear{animation:cardIn .3s ease both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* Источник обозначен ОДНИМ сигналом — точкой у категории (см. .source-dot
     ниже). Раньше это дублировалось ещё и цветной полоской сверху карточки —
     убрали, чтобы не тратить внимание на повтор одной и той же информации. */
  .source-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* Фиксированное соотношение сторон 3:4 с object-fit:cover — иначе широкие
     исходные фото (например ПВХ плёнка) давали визуально "маленькие",
     приплюснутые по высоте карточки при натуральных пропорциях. */
  .card .thumb-wrap{position:relative;width:100%;aspect-ratio:3/4;background:var(--secbg);cursor:pointer;overflow:hidden;}
  .card .thumb-wrap.skeleton{min-height:110px;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s ease;}
  .card img.loaded{opacity:1;}
  .card .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--hint);font-size:12px;text-align:center;padding:10px;}

  /* skeleton-плейсхолдеры на время загрузки */
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  .skeleton{
    background-image:linear-gradient(90deg, var(--secbg) 25%, rgba(0,0,0,0.06) 37%, var(--secbg) 63%);
    background-size:400px 100%;animation:shimmer 1.4s ease infinite;
  }
  .skeleton-card{border-radius:14px;aspect-ratio:1;}

  /* Два маленьких действия поверх фото (сердечко + копировать) вместо
     сердечка на фото И ещё полноширинной кнопки "Копировать" под каждой из
     574 карточек — так текстуре снизу достаётся весь блок вместо повторной
     UI-обвязки на каждой карточке. */
  .heart, .copy-icon-btn{
    position:absolute;right:6px;width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;transition:background-color .15s ease,transform .1s ease;
  }
  .heart{top:6px;font-size:15px;}
  .heart.active{background:#e0245e;animation:heartPop .25s ease;}
  @keyframes heartPop{0%{transform:scale(1);}45%{transform:scale(1.25);}100%{transform:scale(1);}}
  .copy-icon-btn{top:40px;}
  .copy-icon-btn:active{background:rgba(0,0,0,0.6);transform:scale(0.92);}
  .copy-icon-btn svg{width:14px;height:14px;}

  .info{padding:10px 10px 12px;flex:1;display:flex;flex-direction:column;gap:5px;}
  .name{font-size:12.5px;line-height:1.35;font-weight:600;min-height:31px;letter-spacing:.1px;}
  .cat{font-size:10.5px;color:var(--hint);display:flex;align-items:center;}

  .empty{text-align:center;color:var(--hint-strong);padding:40px 10px;font-size:14px;}

  /* fullscreen viewer — фото во весь экран, без полей. Название/категория
     и точки-пагинация лежат ПОВЕРХ фото (градиент снизу для читаемости),
     а не отдельным блоком под ним — экран отдан целиком материалу. */
  .viewer{
    position:fixed;inset:0;background:#000;z-index:50;overflow:hidden;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .viewer.open{opacity:1;pointer-events:auto;}
  /* .vitem — двигается ВЕРТИКАЛЬНО между материалами (свайп вверх/вниз).
     .vswipe/.vtrack внутри него двигаются ГОРИЗОНТАЛЬНО между фото ОДНОГО
     материала (свайп влево/вправо) — два независимых жеста на разных осях,
     см. initViewerGestures в скрипте. */
  .vitem{position:absolute;inset:0;}
  .vswipe{position:absolute;inset:0;overflow:hidden;touch-action:none;}
  .vtrack{display:flex;width:100%;height:100%;will-change:transform;}
  .vslide{flex:0 0 100%;width:100%;height:100%;position:relative;overflow:hidden;background:#000;}
  .vslide img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  /* blur-up: пока грузится полноразмерное фото, сразу показываем уже
     закэшированное маленькое превью растянутым и размытым — воспринимается
     как мгновенное открытие, даже если полный размер ещё в пути */
  .vslide .vthumb{filter:blur(16px);transform:scale(1.08);transition:opacity .3s ease;}
  .vslide .vfull{opacity:0;transition:opacity .3s ease;}
  .vslide .vfull.loaded{opacity:1;}
  .vgradient{
    position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.8) 100%);
  }
  .vcaption{position:absolute;left:0;right:0;bottom:0;padding:0 20px 24px;}
  .vdots{display:flex;gap:6px;margin-bottom:12px;}
  .vdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);transition:background .2s,transform .2s;}
  .vdot.active{background:#fff;transform:scale(1.2);}
  .vcat{color:var(--link);font-size:12px;font-weight:500;margin-bottom:4px;}
  .vname{color:#fff;font-size:17px;font-weight:500;}
  .vnav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;pointer-events:none;}
  .vnavbtn{
    background:rgba(0,0,0,0.45);border:none;color:#fff;font-size:28px;
    width:40px;height:40px;border-radius:50%;cursor:pointer;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:background .15s,opacity .2s;flex:0 0 auto;
  }
  .vnavbtn:active{background:rgba(0,0,0,0.75);}
  .vnavbtn.hidden{opacity:0;pointer-events:none;}
  /* Отступ сверху учитывает ту же зарезервированную под контролы Telegram
     полосу (--content-safe-top), что и основной топбар — иначе ✕/♡/⧉ во
     вьювере оказались бы под "Закрыть"/стрелкой самого Telegram. */
  .vactions{position:absolute;top:calc(16px + var(--content-safe-top, 0px));right:16px;display:flex;flex-direction:column;gap:10px;z-index:2;}
  .vclose, .vcopy, .vheart{
    width:36px;height:36px;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.15);cursor:pointer;font-size:18px;
    transition:background-color .15s ease,transform .1s ease;
  }
  .vcopy svg{width:15px;height:15px;}
  .vheart.active{background:#e0245e;animation:heartPop .25s ease;}

  /* ---- стартовый экран (splash) ----
     Показывается только при первом запуске. Использует ту же светло-серую
     палитру (:root), что и весь остальной каталог — раньше сплэш был
     тёмно-золотым и жил отдельно от темы каталога, теперь оформление
     единое. Фото остаётся на весь экран, но градиент-подложка снизу теперь
     светлая (var(--bg)), а не тёмная, поэтому текст поверх — тёмный. */
  .splash{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    transition:opacity .35s ease;
  }
  .splash.fade-out{opacity:0;pointer-events:none;}
  .splash-hero{
    position:absolute;inset:0;
    /* --splash-tint-rgb зависит от темы (см. applyTheme в скрипте) — тот же
       тон, что и --secbg активной темы. */
    background-image:
      linear-gradient(to bottom, rgba(var(--splash-tint-rgb, 255,255,255),.1) 0%, rgba(var(--splash-tint-rgb, 255,255,255),.6) 55%, rgba(var(--splash-tint-rgb, 255,255,255),.97) 92%),
      url('0000001.webp');
    background-size:cover;background-position:center;
  }
  /* Название бренда — в виде компактного светлого "чипа" поверх фото:
     верхняя часть фото не затемнена градиентом, поэтому подпись держится
     на собственной полупрозрачной подложке, а не полагается на контраст
     с самой картинкой (та может быть светлой или тёмной в разных местах). */
  .splash-top-label{position:absolute;top:22px;left:0;right:0;display:flex;justify-content:center;}
  .splash-top-label span{
    font-size:11px;letter-spacing:2px;color:var(--hint);text-transform:uppercase;
    background:rgba(255,255,255,.82);padding:6px 14px;border-radius:999px;
  }
  .splash-content{position:absolute;left:0;right:0;bottom:0;padding:0 24px 34px;}
  .splash-eyebrow{font-size:12px;color:var(--link);font-weight:700;letter-spacing:.5px;margin-bottom:8px;}
  .splash-title{font-size:26px;font-weight:800;line-height:1.15;color:var(--text);margin-bottom:8px;}
  .splash-sub{font-size:13.5px;color:var(--hint);line-height:1.5;margin-bottom:22px;max-width:300px;}
  .splash-cta{
    width:100%;background:var(--button);color:var(--button-text);font-weight:700;font-size:15px;
    padding:15px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;
  }
  .splash-cta:active{transform:scale(0.98);}
</style>
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-hero"></div>
  <div class="splash-top-label"><span>NeoModernKz</span></div>
  <div class="splash-content">
    <div class="splash-eyebrow" id="splashEyebrow">Материалы для мебели</div>
    <div class="splash-title">Материалы для мебели<br>в одном каталоге</div>
    <div class="splash-sub">Акриловый камень, плёнка ПВХ, листовые материалы — фото, коды, названия под рукой на объекте.</div>
    <button class="splash-cta" id="splashCta">Каталог</button>
  </div>
</div>
<script>
  // Синхронная быстрая проверка ДО отрисовки остального — чтобы у тех, кто
  // уже видел сплэш раньше, не было даже короткой "вспышки" тёмного экрана
  // поверх каталога. localStorage тут просто быстрый локальный кэш флага;
  // источник истины (CloudStorage, синхронизируется между устройствами)
  // проверяется отдельно ниже, в основном скрипте приложения.
  (function(){
    try {
      if (localStorage.getItem('splash_seen') === '1') {
        var s = document.getElementById('splash');
        if (s) s.style.display = 'none';
      }
    } catch (e) {}
  })();
</script>
<div class="safe-top-blur"></div>
<!-- ВАЖНО: .topbar лежит СНАРУЖИ #app (сиблинг, не потомок) — это принципиально.
     #app анимирует свой transform (см. <style>), а любой transform на предке
     превращает его в "точку отсчёта" для position:fixed внутри — то есть
     будь топбар потомком #app, он перестал бы быть по-настоящему fixed
     относительно экрана и вместо этого уезжал/возвращался вместе с
     прокруткой контента (обнаружено по видео с реального устройства — шапка
     возвращалась только у самого начала списка). Раз топбар снаружи #app,
     эта проблема исключена в принципе, не только на практике. -->
<div class="topbar">

  <!-- Второй, отдельный от боковой шторки способ выбрать категорию — прямо

       открытый список select'а рисует ОС/браузер, а не наш CSS, поэтому
       он выглядел тёмным и чужеродным на светлой теме. Ведёт к тому же
       state.category/state.favOnly, держим временно вместе с шторкой и

  <button class="top-cat-btn" id="topCatBtn">
    <span id="topCatBtnLabel">Все материалы</span>
    <span class="top-cat-btn-arrow">▾</span>

  <!-- Третий вход в тот же фильтр — панель иконок-ярлыков ПОД кнопкой
       категории, внутри топбара (по образцу подобных рядов в других

       несколькими категориями внутри тап открывает всплывающее мини-меню

  <div class="quick-row" id="quickRow"></div>

<div id="app">

<div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Временный переключатель тем — чтобы выбрать одну из нескольких палитр
       на глаз, вживую в приложении, а не по превью-картинке. Потом либо
       уберём и оставим одну тему, либо оставим как обычную настройку —

        <rect x="9" y="9" width="12" height="12" rx="2"></rect>
