<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Каталог материалов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secbg: var(--tg-theme-secondary-bg-color, #f4f4f5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{padding:8px 10px 24px;}

  .topbar{position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:5;border-bottom:1px solid var(--secbg);}
  .search{
    width:100%;padding:10px 12px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:15px;outline:none;
  }
  .search::placeholder{color:var(--hint);}

  .topbar-row{display:flex;gap:8px;align-items:center;}
  .search{flex:1;}
  .menu-btn{
    flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:none;
    background:var(--secbg);color:var(--text);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:7px 14px;border-radius:16px;background:var(--secbg);
    color:var(--text);font-size:13px;white-space:nowrap;cursor:pointer;user-select:none;
    border:1px solid transparent;transition:background-color .15s ease,color .15s ease;
  }
  .chip.active{background:var(--button);color:var(--button-text);}
  .chip.fav.active{background:#e0245e;color:#fff;}

  /* боковая шторка с категориями по сайтам-источникам */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:86%;max-width:330px;background:var(--bg);
    z-index:61;transform:translateX(-102%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 24px;
    border-right:1px solid var(--secbg);
  }
  .drawer.open{transform:translateX(0);}
  .drawer.dragging{transition:none;}
  .drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .drawer-title{font-size:17px;font-weight:700;letter-spacing:.1px;}
  .drawer-close{
    width:32px;height:32px;border-radius:50%;background:var(--secbg);display:flex;
    align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex:0 0 auto;
    transition:background-color .15s ease,transform .15s ease;
  }
  .drawer-close:active{transform:scale(0.9);}

  .drawer-item{
    padding:12px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:600;
    margin-bottom:4px;transition:background-color .15s ease,color .15s ease;
  }
  .drawer-item.active{background:var(--button);color:var(--button-text);}

  .drawer-section-label{
    font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--hint);text-transform:uppercase;
    margin:18px 4px 8px;
  }

  .drawer-group{margin-bottom:8px;border-radius:12px;background:var(--secbg);overflow:hidden;}
  .drawer-group-header{
    display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;
    cursor:pointer;transition:background-color .15s ease;
  }
  .drawer-group-badge{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.2px;
  }
  .drawer-group-text{flex:1;min-width:0;}
  .drawer-group-title{font-weight:700;font-size:13.5px;}
  .drawer-group-sub{font-weight:400;font-size:11.5px;color:var(--hint);margin-top:1px;}
  .drawer-group-arrow{transition:transform .25s ease;color:var(--hint);font-size:12px;flex:0 0 auto;}
  .drawer-group.expanded .drawer-group-arrow{transform:rotate(90deg);}
  .drawer-subitems{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .drawer-group.expanded .drawer-subitems{max-height:700px;}
  .drawer-subitem{
    display:flex;justify-content:space-between;gap:8px;padding:9px 12px 9px 54px;
    font-size:13px;color:var(--text);cursor:pointer;transition:background-color .12s ease;
  }
  .drawer-subitem:active{background:rgba(0,0,0,0.05);}
  .drawer-subitem.active{color:var(--button);font-weight:700;}
  .drawer-subitem .n{color:var(--hint);font-size:11px;flex:0 0 auto;}

  .count{color:var(--hint);font-size:12px;margin:8px 2px 4px;}

  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;
  }
  @media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr);}}

  .card{
    background:var(--secbg);border-radius:14px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;border-top:3px solid transparent;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(0.97);}
  .card.appear{animation:cardIn .3s ease both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* сдержанные цветовые акценты по сайтам-источникам */
  .card[data-site="emc"]{border-top-color:#2481cc;}
  .card[data-site="adilet"]{border-top-color:#c08a2e;}
  .card[data-site="interstone"]{border-top-color:#7c8591;}
  .source-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  .card .thumb-wrap{position:relative;width:100%;aspect-ratio:1/1;background:var(--secbg);cursor:pointer;overflow:hidden;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s ease;}
  .card img.loaded{opacity:1;}
  .card .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--hint);font-size:12px;text-align:center;padding:6px;}

  /* skeleton-плейсхолдеры на время загрузки */
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  .skeleton{
    background-image:linear-gradient(90deg, var(--secbg) 25%, rgba(120,120,130,0.14) 37%, var(--secbg) 63%);
    background-size:400px 100%;animation:shimmer 1.4s ease infinite;
  }
  .skeleton-card{border-radius:14px;aspect-ratio:1;}

  .heart{
    position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;
    font-size:15px;cursor:pointer;transition:background-color .15s ease;
  }
  .heart.active{background:#e0245e;animation:heartPop .25s ease;}
  @keyframes heartPop{0%{transform:scale(1);}45%{transform:scale(1.25);}100%{transform:scale(1);}}

  .info{padding:10px 10px 12px;flex:1;display:flex;flex-direction:column;gap:5px;}
  .name{font-size:12.5px;line-height:1.35;font-weight:600;min-height:31px;letter-spacing:.1px;}
  .cat{font-size:10.5px;color:var(--hint);display:flex;align-items:center;}
  .copy-btn{
    margin-top:auto;border:none;border-radius:8px;padding:7px 0;font-size:11.5px;font-weight:600;
    background:var(--button);color:var(--button-text);cursor:pointer;transition:transform .1s ease,opacity .1s ease;
  }
  .copy-btn:active{transform:scale(0.96);opacity:.85;}

  .empty{text-align:center;color:var(--hint);padding:40px 10px;font-size:14px;}

  /* fullscreen viewer */
  .viewer{
    position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;
    align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:16px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .viewer.open{opacity:1;pointer-events:auto;}
  .vswipe{
    width:100%;max-height:70vh;overflow:hidden;position:relative;border-radius:10px;
    transform:scale(.96);transition:transform .2s ease;touch-action:pan-y;
  }
  .viewer.open .vswipe{transform:scale(1);}
  .vtrack{display:flex;width:100%;height:100%;will-change:transform;}
  .vtrack img{
    flex:0 0 100%;width:100%;max-height:70vh;object-fit:contain;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }
  .vdots{display:flex;gap:6px;justify-content:center;margin-top:10px;min-height:14px;}
  .vdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.3);transition:background .2s,transform .2s;}
  .vdot.active{background:#fff;transform:scale(1.2);}
  .vnav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;pointer-events:none;}
  .vnavbtn{
    background:rgba(0,0,0,0.45);border:none;color:#fff;font-size:28px;
    width:40px;height:40px;border-radius:50%;cursor:pointer;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:background .15s,opacity .2s;flex:0 0 auto;
  }
  .vnavbtn:active{background:rgba(0,0,0,0.75);}
  .vnavbtn.hidden{opacity:0;pointer-events:none;}
  .viewer .vname{color:#fff;font-size:15px;margin-top:12px;text-align:center;}
  .viewer .vcat{color:#bbb;font-size:12px;margin-top:4px;}
  .viewer .vclose{
    position:absolute;top:16px;right:16px;color:#fff;font-size:22px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.15);border-radius:50%;cursor:pointer;z-index:1;
  }
  .viewer .vcopy{
    margin-top:16px;border:none;border-radius:10px;padding:10px 20px;font-size:14px;
    background:var(--button);color:var(--button-text);cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <button class="menu-btn" id="menuBtn" aria-label="Категории">☰</button>
      <input class="search" id="search" type="text" placeholder="Поиск по названию или коду...">
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Ничего не найдено</div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">Категории</div>
    <div class="drawer-close" id="drawerClose">✕</div>
  </div>
  <div class="drawer-item" id="drawerAll">Все материалы</div>
  <div class="drawer-item" id="drawerFav">★ Избранное</div>
  <div id="drawerGroups"></div>
</div>

<div class="viewer" id="viewer">
  <div class="vclose" id="vclose">✕</div>
  <div class="vswipe" id="vswipe">
    <div class="vtrack" id="vtrack"></div>
    <div class="vnav">
      <button class="vnavbtn hidden" id="vprev">‹</button>
      <button class="vnavbtn hidden" id="vnext">›</button>
    </div>
  </div>
  <div class="vdots" id="vdots"></div>
  <div class="vname" id="vname"></div>
  <div class="vcat" id="vcat"></div>
  <button class="vcopy" id="vcopy">Скопировать название/код</button>
</div>

<script>
(function(){
  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  var state = {
    items: [],
    category: 'Все',
    favOnly: false,
    query: '',
    favorites: [],
    expandedGroups: {}
  };

  var els = {
    grid: document.getElementById('grid'),
    chips: document.getElementById('chips'),
    search: document.getElementById('search'),
    count: document.getElementById('count'),
    empty: document.getElementById('empty'),
    viewer: document.getElementById('viewer'),
    vswipe: document.getElementById('vswipe'),
    vtrack: document.getElementById('vtrack'),
    vdots: document.getElementById('vdots'),
    vprev: document.getElementById('vprev'),
    vnext: document.getElementById('vnext'),
    vname: document.getElementById('vname'),
    vcat: document.getElementById('vcat'),
    vcopy: document.getElementById('vcopy'),
    vclose: document.getElementById('vclose'),
    menuBtn: document.getElementById('menuBtn'),
    drawer: document.getElementById('drawer'),
    drawerOverlay: document.getElementById('drawerOverlay'),
    drawerClose: document.getElementById('drawerClose'),
    drawerAll: document.getElementById('drawerAll'),
    drawerFav: document.getElementById('drawerFav'),
    drawerGroups: document.getElementById('drawerGroups')
  };

  // ---- группировка категорий по сайтам-источникам (для боковой шторки) ----
  // Категории неймспейсятся по префиксу названия — это позволяет добавлять
  // новые сайты/категории в скрапере без правок фронтенда: всё, что не
  // "ПВХ плёнка: ..." и не "Акриловый камень ...", считается материалами em-c.kz.
  function siteGroupOf(cat){
    if (cat.indexOf('ПВХ плёнка') === 0) return 'adilet';
    if (cat.indexOf('Акриловый камень') === 0) return 'interstone';
    return 'emc';
  }
  var SITE_META = {
    emc: { title: 'EM-C.KZ', subtitle: 'Листовые материалы', color: '#2481cc' },
    adilet: { title: 'ADILET.NET', subtitle: 'Плёнка ПВХ', color: '#c08a2e' },
    interstone: { title: 'INTERSTONE.KZ', subtitle: 'Акриловый камень', color: '#7c8591' }
  };
  var SITE_ORDER = ['emc', 'adilet', 'interstone'];

  // ---- избранное: Telegram CloudStorage с фоллбеком на localStorage ----
  // CloudStorage доступен не во всех версиях клиента Telegram (и отсутствует
  // вовсе при открытии страницы вне Telegram) — вызов может синхронно кинуть
  // исключение ("WebAppMethodUnsupported"), поэтому всё оборачиваем в try/catch.
  function cloudStorageAvailable(){
    return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  }

  function loadFavorites(cb){
    if (cloudStorageAvailable()) {
      try {
        tg.CloudStorage.getItem('favorites', function(err, value){
          if (!err && value) {
            try { state.favorites = JSON.parse(value); } catch(e){ state.favorites = []; }
          }
          cb();
        });
      } catch (e) {
        loadFavoritesLocal();
        cb();
      }
    } else {
      loadFavoritesLocal();
      cb();
    }
  }

  function loadFavoritesLocal(){
    try { state.favorites = JSON.parse(localStorage.getItem('favorites') || '[]'); } catch(e){ state.favorites = []; }
  }

  function saveFavorites(){
    var json = JSON.stringify(state.favorites);
    if (cloudStorageAvailable()) {
      try { tg.CloudStorage.setItem('favorites', json, function(){}); }
      catch (e) { localStorage.setItem('favorites', json); }
    } else {
      localStorage.setItem('favorites', json);
    }
  }

  function toggleFavorite(id){
    var idx = state.favorites.indexOf(id);
    if (idx >= 0) state.favorites.splice(idx, 1);
    else state.favorites.push(id);
    saveFavorites();
    render();
  }

  // ---- загрузка каталога ----
  function loadCatalog(){
    fetch('data/materials.json', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        console.log('[catalog] каталог загружен:', data.length, 'позиций');
        state.items = data;
        buildChips();
        buildDrawer();
        render();
      })
      .catch(function(err){
        console.error('[catalog] ошибка загрузки materials.json:', err);
        els.empty.style.display = 'block';
        els.empty.textContent = 'Не удалось загрузить каталог';
      });
  }

  // Полный список категорий теперь живёт в боковой шторке (сгруппирован по
  // сайтам-источникам, см. buildDrawer). Здесь — только быстрый доступ:
  // "Все", активный фильтр (если выбран через шторку) и "Избранное".
  function buildChips(){
    els.chips.innerHTML = '';

    var allChip = document.createElement('div');
    allChip.className = 'chip' + (state.category === 'Все' && !state.favOnly ? ' active' : '');
    allChip.textContent = 'Все';
    allChip.onclick = function(){
      state.category = 'Все';
      state.favOnly = false;
      render();
      buildChips();
      buildDrawer();
    };
    els.chips.appendChild(allChip);

    if (state.category !== 'Все' && !state.favOnly) {
      var curChip = document.createElement('div');
      curChip.className = 'chip active';
      curChip.textContent = state.category + '  ✕';
      curChip.onclick = function(){
        state.category = 'Все';
        render();
        buildChips();
        buildDrawer();
      };
      els.chips.appendChild(curChip);
    }

    var favChip = document.createElement('div');
    favChip.className = 'chip fav' + (state.favOnly ? ' active' : '');
    favChip.textContent = '★ Избранное';
    favChip.onclick = function(){
      state.favOnly = !state.favOnly;
      render();
      buildChips();
      buildDrawer();
    };
    els.chips.appendChild(favChip);
  }

  // ---- боковая шторка: категории сгруппированы по сайтам-источникам ----
  function buildDrawer(){
    var groups = {}; // ключ сайта -> { cats: {название: количество}, total: n }
    state.items.forEach(function(it){
      var g = siteGroupOf(it.category);
      if (!groups[g]) groups[g] = { cats: {}, total: 0 };
      groups[g].total++;
      groups[g].cats[it.category] = (groups[g].cats[it.category] || 0) + 1;
    });

    els.drawerAll.className = 'drawer-item' + (state.category === 'Все' && !state.favOnly ? ' active' : '');
    els.drawerFav.className = 'drawer-item' + (state.favOnly ? ' active' : '');

    els.drawerGroups.innerHTML = '';

    var label = document.createElement('div');
    label.className = 'drawer-section-label';
    label.textContent = 'Источники';
    els.drawerGroups.appendChild(label);

    SITE_ORDER.forEach(function(key){
      var g = groups[key];
      if (!g) return;
      var meta = SITE_META[key] || { title: key, subtitle: '', color: '#888' };
      var catNames = Object.keys(g.cats).sort();

      // При первом попадании категории в эту группу разворачиваем её один раз
      // (чтобы было видно активный фильтр), но дальше состояние развёрнутости
      // подчиняется ТОЛЬКО ручному клику — иначе группа "залипала" открытой
      // и не закрывалась по клику, пока в ней выбрана категория.
      if (state.expandedGroups[key] === undefined && !state.favOnly && catNames.indexOf(state.category) !== -1) {
        state.expandedGroups[key] = true;
      }
      var isExpanded = !!state.expandedGroups[key];

      var groupEl = document.createElement('div');
      groupEl.className = 'drawer-group' + (isExpanded ? ' expanded' : '');
      groupEl.setAttribute('data-site', key);

      var header = document.createElement('div');
      header.className = 'drawer-group-header';
      header.innerHTML =
        '<div class="drawer-group-badge" style="background:' + meta.color + '">' + meta.title.charAt(0) + '</div>' +
        '<div class="drawer-group-text">' +
          '<div class="drawer-group-title">' + meta.title + '</div>' +
          '<div class="drawer-group-sub">' + meta.subtitle + ' · ' + g.total + '</div>' +
        '</div>' +
        '<div class="drawer-group-arrow">▶</div>';
      header.onclick = function(){
        state.expandedGroups[key] = !isExpanded;
        buildDrawer();
      };
      groupEl.appendChild(header);

      var subitemsWrap = document.createElement('div');
      subitemsWrap.className = 'drawer-subitems';
      catNames.forEach(function(catName){
        var sub = document.createElement('div');
        sub.className = 'drawer-subitem' + (state.category === catName && !state.favOnly ? ' active' : '');
        sub.innerHTML = '<span>' + catName + '</span><span class="n">' + g.cats[catName] + '</span>';
        sub.onclick = function(){
          state.category = catName;
          state.favOnly = false;
          render();
          buildChips();
          buildDrawer();
          closeDrawer();
        };
        subitemsWrap.appendChild(sub);
      });
      groupEl.appendChild(subitemsWrap);

      els.drawerGroups.appendChild(groupEl);
    });
  }

  function openDrawer(){
    els.drawer.classList.add('open');
    els.drawerOverlay.classList.add('open');
  }
  function closeDrawer(){
    els.drawer.classList.remove('open');
    els.drawerOverlay.classList.remove('open');
  }

  // ---- свайп для закрытия шторки: панель следует за пальцем, на отпускании
  // либо плавно захлопывается обратно, либо доезжает и закрывается ----
  (function initDrawerSwipe(){
    var drag = null;
    var W = 320;
    els.drawer.addEventListener('touchstart', function(e){
      if (!els.drawer.classList.contains('open')) return;
      W = els.drawer.offsetWidth;
      drag = { startX: e.touches[0].clientX, startY: e.touches[0].clientY, dx: 0, locked: null };
      els.drawer.classList.add('dragging');
    }, {passive:true});
    els.drawer.addEventListener('touchmove', function(e){
      if (!drag) return;
      var t = e.touches[0];
      var dx = t.clientX - drag.startX;
      var dy = t.clientY - drag.startY;
      if (drag.locked === null) drag.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.locked !== 'x' || dx > 0) return;
      drag.dx = dx;
      els.drawer.style.transform = 'translateX(' + dx + 'px)';
      els.drawerOverlay.style.opacity = Math.max(0, 1 + dx / W) * 1;
    }, {passive:true});
    els.drawer.addEventListener('touchend', function(){
      if (!drag) return;
      els.drawer.classList.remove('dragging');
      els.drawer.style.transform = '';
      els.drawerOverlay.style.opacity = '';
      if (drag.dx < -W * 0.28) closeDrawer();
      drag = null;
    });
  })();

  els.menuBtn.onclick = openDrawer;
  els.drawerClose.onclick = closeDrawer;
  els.drawerOverlay.onclick = closeDrawer;
  els.drawerAll.onclick = function(){
    state.category = 'Все';
    state.favOnly = false;
    render();
    buildChips();
    buildDrawer();
    closeDrawer();
  };
  els.drawerFav.onclick = function(){
    state.favOnly = !state.favOnly;
    render();
    buildChips();
    buildDrawer();
    closeDrawer();
  };

  function matches(item){
    if (state.favOnly && state.favorites.indexOf(item.id) === -1) return false;
    if (!state.favOnly && state.category !== 'Все' && item.category !== state.category) return false;
    if (state.query) {
      var q = state.query.toLowerCase();
      if (item.name.toLowerCase().indexOf(q) === -1 && item.id.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  // Пока каталог не загружен, показываем "дышащие" плейсхолдеры карточек —
  // это выглядит опрятнее пустого экрана и снижает ощущение подвисания.
  function renderSkeleton(){
    els.grid.innerHTML = '';
    els.empty.style.display = 'none';
    els.count.textContent = 'Загрузка каталога…';
    for (var i = 0; i < 8; i++) {
      var sk = document.createElement('div');
      sk.className = 'skeleton skeleton-card';
      els.grid.appendChild(sk);
    }
  }

  function render(){
    var filtered = state.items.filter(matches);
    els.count.textContent = filtered.length + ' материал(ов)';
    els.grid.innerHTML = '';
    els.empty.style.display = filtered.length ? 'none' : 'block';

    filtered.forEach(function(item, idx){
      var site = siteGroupOf(item.category);
      var siteColor = (SITE_META[site] || {}).color || 'transparent';

      var card = document.createElement('div');
      card.className = 'card appear';
      card.setAttribute('data-site', site);
      // лёгкий "каскадный" эффект появления, без задержки для длинных списков
      card.style.animationDelay = Math.min(idx * 12, 240) + 'ms';

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      // Для карточки в сетке используем маленькое превью (item.thumb, ~400px),
      // а не полноразмерное фото — так грузится в разы быстрее и легче.
      // Фолбэки нужны для товаров, у которых materials.json ещё старого
      // формата (без поля thumb) — тогда используем то, что есть.
      var thumbSrc = item.thumb || (Array.isArray(item.images) && item.images[0]) || item.image;
      if (thumbSrc) {
        thumbWrap.classList.add('skeleton');
        var img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = item.name;
        img.onload = function(){ img.classList.add('loaded'); thumbWrap.classList.remove('skeleton'); };
        img.onerror = function(){
          console.error('[catalog] не удалось загрузить фото карточки:', thumbSrc, 'товар:', item.id);
          thumbWrap.classList.remove('skeleton');
          img.remove();
          var brokenEl = document.createElement('div');
          brokenEl.className = 'noimg';
          brokenEl.textContent = 'Фото недоступно';
          thumbWrap.insertBefore(brokenEl, thumbWrap.firstChild);
        };
        img.src = thumbSrc;
        thumbWrap.appendChild(img);
      } else {
        var noimg = document.createElement('div');
        noimg.className = 'noimg';
        noimg.textContent = item.name;
        thumbWrap.appendChild(noimg);
      }
      thumbWrap.onclick = function(){ openViewer(item); };

      var heart = document.createElement('div');
      heart.className = 'heart' + (state.favorites.indexOf(item.id) >= 0 ? ' active' : '');
      heart.textContent = state.favorites.indexOf(item.id) >= 0 ? '♥' : '♡';
      heart.onclick = function(e){ e.stopPropagation(); toggleFavorite(item.id); };
      thumbWrap.appendChild(heart);

      var info = document.createElement('div');
      info.className = 'info';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;
      var cat = document.createElement('div');
      cat.className = 'cat';
      var dot = document.createElement('span');
      dot.className = 'source-dot';
      dot.style.background = siteColor;
      cat.appendChild(dot);
      cat.appendChild(document.createTextNode(item.category));
      var copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Копировать';
      copyBtn.onclick = function(e){ e.stopPropagation(); copyText(item.name); };

      info.appendChild(name);
      info.appendChild(cat);
      info.appendChild(copyBtn);

      card.appendChild(thumbWrap);
      card.appendChild(info);
      els.grid.appendChild(card);
    });
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
        try {
          if (tg && tg.showPopup && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
            tg.showPopup({ message: 'Скопировано: ' + text });
          } else {
            alert('Скопировано: ' + text);
          }
        } catch(e){ alert('Скопировано: ' + text); }
      });
    }
  }

  // ---- просмотрщик фото: живая drag-карусель вместо мгновенной смены src ----
  // Все фото товара рендерятся в один горизонтальный "трек"; во время свайпа
  // трек следует за пальцем без задержки, на отпускании — плавно доезжает
  // до соседнего кадра или пружинисто возвращается назад (rubber-band на краях).
  var viewerState = { images: [], idx: 0 };

  function setTrackTransform(px, animate){
    els.vtrack.style.transition = animate ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
    els.vtrack.style.transform = 'translateX(calc(' + (-viewerState.idx * 100) + '% + ' + px + 'px))';
  }

  function updateViewerChrome(){
    var imgs = viewerState.images, idx = viewerState.idx;
    els.vdots.innerHTML = '';
    if (imgs.length > 1){
      imgs.forEach(function(_, i){
        var dot = document.createElement('div');
        dot.className = 'vdot' + (i === idx ? ' active' : '');
        els.vdots.appendChild(dot);
      });
    }
    els.vprev.className = 'vnavbtn' + (idx === 0 ? ' hidden' : '');
    els.vnext.className = 'vnavbtn' + (idx >= imgs.length - 1 ? ' hidden' : '');
  }

  function goToImage(newIdx, animate){
    viewerState.idx = Math.max(0, Math.min(newIdx, viewerState.images.length - 1));
    setTrackTransform(0, animate !== false);
    updateViewerChrome();
  }

  function openViewer(item){
    var imgs = Array.isArray(item.images) && item.images.length ? item.images : (item.image ? [item.image] : []);
    viewerState.images = imgs;
    viewerState.idx = 0;
    console.log('[catalog] открыт просмотрщик:', item.id, '— фото:', imgs.length);

    els.vtrack.innerHTML = '';
    imgs.forEach(function(src){
      var img = document.createElement('img');
      img.alt = item.name;
      img.draggable = false;
      img.onerror = function(){
        console.error('[catalog] не удалось загрузить фото во вьювере:', src, 'товар:', item.id);
        var brokenEl = document.createElement('div');
        brokenEl.style.cssText = 'flex:0 0 100%;width:100%;max-height:70vh;aspect-ratio:1/1;' +
          'display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px;';
        brokenEl.textContent = 'Фото недоступно';
        els.vtrack.insertBefore(brokenEl, img);
        img.remove();
      };
      img.src = src;
      els.vtrack.appendChild(img);
    });
    setTrackTransform(0, false);
    updateViewerChrome();

    els.vname.textContent = item.name;
    els.vcat.textContent = item.category;
    els.vcopy.onclick = function(){ copyText(item.name); };
    els.viewer.classList.add('open');
  }

  els.vprev.onclick = function(e){ e.stopPropagation(); goToImage(viewerState.idx - 1); };
  els.vnext.onclick = function(e){ e.stopPropagation(); goToImage(viewerState.idx + 1); };

  (function initViewerSwipe(){
    var drag = null;
    els.vswipe.addEventListener('touchstart', function(e){
      if (viewerState.images.length < 2) return;
      drag = { startX: e.touches[0].clientX, startY: e.touches[0].clientY, dx: 0, locked: null };
    }, {passive:true});
    els.vswipe.addEventListener('touchmove', function(e){
      if (!drag) return;
      var t = e.touches[0];
      var dx = t.clientX - drag.startX;
      var dy = t.clientY - drag.startY;
      if (drag.locked === null) drag.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.locked !== 'x') return;
      // пружинистое сопротивление на первом/последнем кадре
      var atStart = viewerState.idx === 0 && dx > 0;
      var atEnd = viewerState.idx === viewerState.images.length - 1 && dx < 0;
      drag.dx = (atStart || atEnd) ? dx * 0.35 : dx;
      setTrackTransform(drag.dx, false);
    }, {passive:true});
    els.vswipe.addEventListener('touchend', function(){
      if (!drag) return;
      var w = els.vswipe.clientWidth || 300;
      if (drag.dx <= -w * 0.18) goToImage(viewerState.idx + 1);
      else if (drag.dx >= w * 0.18) goToImage(viewerState.idx - 1);
      else goToImage(viewerState.idx);
      drag = null;
    });
  })();

  els.vclose.onclick = function(){ els.viewer.classList.remove('open'); };
  els.viewer.addEventListener('click', function(e){
    if (e.target === els.viewer) els.viewer.classList.remove('open');
  });

  var searchTimer;
  els.search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var val = els.search.value;
    searchTimer = setTimeout(function(){
      state.query = val;
      render();
    }, 150);
  });

  renderSkeleton();
  loadFavorites(loadCatalog);
})();
</script>
</body>
</html>
